# Eastgate Tower Configuration
# For 2-tower federation with Strandgate

[orchestrator]
database_url = "sqlite:eastgate-toadstool.db"
enable_resource_management = true
enable_consent_management = true
enable_observability = true

[server]
bind_addr = "0.0.0.0"
port = 8080

[federation]
enabled = true
tower_id = "tower-eastgate"
tower_name = "Eastgate"

# Federation coordinator (Strandgate)
coordinator_url = "https://192.168.1.134:8081"
coordinator_enabled = false  # We're not the coordinator

# Known peers
[[federation.peers]]
tower_id = "tower-strandgate"
address = "192.168.1.134:8081"
capabilities = ["coordinator", "compute", "ml-training"]

[discovery]
enabled = true
mdns_enabled = true
# Capabilities to advertise
local_capabilities = ["compute", "ml-training", "ml-inference", "gpu-rtx-2070"]

[rpc]
tarpc_addr = "[::]:8091"
tarpc_tls_enabled = false  # Start simple, add TLS after basic works
jsonrpc_addr = "[::]:8080"

[tls]
enabled = false  # Start without TLS for debugging
auto_generate = true

[logging]
level = "info"

