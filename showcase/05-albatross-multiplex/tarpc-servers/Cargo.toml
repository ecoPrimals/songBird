[package]
name = "standalone-tarpc-servers"
version = "0.1.0"
edition = "2021"
description = "Standalone tarpc servers for Albatross benchmarking"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/songbird"
readme = "../README.md"
keywords = ["tarpc", "rpc", "server", "benchmark"]
categories = ["development-tools::profiling"]

[[bin]]
name = "tarpc-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
tarpc = { workspace = true, features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

