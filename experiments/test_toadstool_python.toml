# Simple Python test workload
[metadata]
name = "python-test"
description = "Test if Toadstool Python runtime works"
version = "1.0"

[execution]
type = "python"
script = "import sys; import torch; print(f'Python: {sys.version}'); print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}'); print(f'GPU Count: {torch.cuda.device_count()}')"

[resources]
cpu_cores = 1.0
memory_mb = 1024
gpu = true

