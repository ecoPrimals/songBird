# Songbird Gaming Bridge - Core AGPL 3.0 Deployment
# 
# 100% Open Source Gaming Bridge - No External Dependencies
# LICENSE: AGPL 3.0 (Free Forever)
#
# This deployment includes only the core gaming bridge functionality:
# - Protocol detection (IPX, DirectPlay, NetBIOS)
# - Network bridging and NAT traversal
# - Gaming session management
# - Basic HTTP API
#
# No monitoring, load balancing, or enterprise features
# All functionality is 100% Rust-based and AGPL 3.0 licensed

version: '3.8'

services:
  # Core Gaming Bridge - Single Instance (AGPL 3.0)
  songbird-gaming-bridge:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: songbird-gaming-bridge
    restart: unless-stopped
    ports:
      - "7000-8000:7000-8000/udp"  # Full gaming port range
      - "8080:8080/tcp"            # HTTP API
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./docker/songbird-core.toml:/app/config/production.toml:ro
    environment:
      - RUST_LOG=info
      - SONGBIRD_LICENSE=AGPL3
      - SONGBIRD_MODE=core
      - SONGBIRD_GAMING_PORT_START=7000
      - SONGBIRD_GAMING_PORT_END=8000
      - SONGBIRD_EXTERNAL_MONITORING=false
      - SONGBIRD_BUILT_IN_METRICS=true
    cap_add:
      - NET_RAW          # For packet capture
      - NET_ADMIN        # For network configuration
    sysctls:
      - net.core.rmem_max=134217728
      - net.core.wmem_max=134217728
      - net.ipv4.udp_mem=102400 873800 16777216
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "songbird", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - songbird-core-network

networks:
  songbird-core-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# No persistent volumes needed for core deployment
# All state is managed in-memory or in local files 