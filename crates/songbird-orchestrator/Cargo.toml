[package]
name = "songbird-orchestrator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Main Songbird gaming bridge orchestrator application"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["orchestrator", "gaming", "bridge", "distributed", "application"]
categories = ["command-line-utilities", "game-engines", "network-programming"]

[[bin]]
name = "songbird-orchestrator"
path = "src/main.rs"

[dependencies]
# All workspace crates
songbird-core = { path = "../songbird-core" }
songbird-network = { path = "../songbird-network" }
# songbird-security = { path = "../songbird-security" } # Temporarily disabled
songbird-discovery = { path = "../songbird-discovery" }
songbird-observability = { path = "../songbird-observability" }
# songbird-federation = { path = "../songbird-federation" } # Temporarily disabled
songbird-config = { path = "../songbird-config" }
songbird-cli = { path = "../songbird-cli" }
songbird-errors = { path = "../songbird-errors" }

# Runtime
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"

# HTTP server for web dashboard
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
