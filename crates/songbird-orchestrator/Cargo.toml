[package]
name = "songbird-orchestrator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Main Songbird gaming bridge orchestrator application"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["orchestrator", "gaming", "bridge", "distributed", "application"]
categories = ["command-line-utilities", "game-engines", "network-programming"]


[lints]
workspace = true

[[bin]]
name = "songbird-orchestrator"
path = "src/main.rs"

[dependencies]
# All workspace crates (songbird-core consolidated into this crate)
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-execution-agent = { path = "../songbird-execution-agent" }  # For CommandExecutor integration
# songbird-security-errors = { path = "../songbird-security-errors" }  # REMOVED: Using unified errors from songbird-types
songbird-network-federation = { path = "../songbird-network-federation" }  # NEW: Consolidated
songbird-discovery = { path = "../songbird-discovery" }
songbird-observability = { path = "../songbird-observability" }
songbird-registry = { path = "../songbird-registry" }
songbird-universal = { path = "../songbird-universal" }
# songbird-primal-sdk = { path = "../songbird-primal-sdk" }  # TEMPORARILY DISABLED: Syntax errors need fixing
# songbird-cli = { path = "../songbird-cli" }  # TEMPORARILY DISABLED: Syntax errors need fixing

# Runtime
tokio = { workspace = true }
chrono = { workspace = true }
async-trait = { version = "0.1" }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = { workspace = true }
uuid = { version = "1.0", features = ["v4", "v5", "v7"] }

# Task lifecycle dependencies
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
zstd = "0.13"
sha2 = "0.10"
base64 = "0.22"

colored = "2.0"
parking_lot = "0.12"
num_cpus = "1.16"
fastrand = "2.0"
rand = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }
socket2 = { workspace = true }
if-addrs = { workspace = true }
serde_yaml = "0.9.34"
sysinfo = "0.30"
hostname = "0.4"
dirs = "5.0"
md5 = "0.7"
async-stream = "0.3"
tokio-stream = "0.1"

# HTTP server for web dashboard
axum = { version = "0.7", features = ["multipart", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }  # TLS support for axum
rustls = { version = "0.23", features = ["ring"] }  # Explicit rustls for crypto provider init
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Access control and authentication
jsonwebtoken = "9.3"

# tarpc for high-performance native RPC (Phase 3)
tarpc = { workspace = true, features = ["full"] }
bincode = { workspace = true }
jsonrpsee = { version = "0.26.0", features = ["server", "client"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
tokio-serde = { version = "0.8.0", features = ["bincode"] }

[dev-dependencies]
songbird-test-utils = { path = "../songbird-test-utils" }
serial_test = "3.0"
tokio-tungstenite = "0.24"
futures-util = "0.3"

