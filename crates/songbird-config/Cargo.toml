[package]
name = "songbird-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Configuration management for Songbird components"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["configuration", "gaming", "orchestration", "networking", "distributed"]
categories = ["config", "network-programming", "game-engines"]


[lints]
workspace = true

[features]
default = []
mdns = []

[dependencies]
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
url = "2.5"
gethostname = { workspace = true }
hickory-resolver = { workspace = true }
mdns-sd = "0.10"

# [target.'cfg(unix)'.dependencies]
# libc removed - not used, evolved to pure Rust alternatives

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
songbird-test-utils = { path = "../songbird-test-utils" }
