[package]
name = "songbird-config"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Configuration management for Songbird components"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["configuration", "gaming", "orchestration", "networking", "distributed"]
categories = ["config", "network-programming", "game-engines"]


[lints]
workspace = true

[dependencies]
songbird-types = { path = "../songbird-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.14"
toml = "0.8"
tracing = "0.1"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
rand = { workspace = true }
dirs = "5.0"
num_cpus = "1.16"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
gethostname = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serial_test = "3.0"

