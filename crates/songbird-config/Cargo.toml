[package]
name = "songbird-config"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Configuration management for Songbird components"

[dependencies]
songbird-errors = { path = "../songbird-errors" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.14"
toml = "0.8"
tracing = "0.1"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
rand = "0.8"
dirs = "5.0"
num_cpus = "1.16"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
