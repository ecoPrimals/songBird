[package]
name = "songbird-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Configuration management for Songbird components"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["configuration", "gaming", "orchestration", "networking", "distributed"]
categories = ["config", "network-programming", "game-engines"]


[lints]
workspace = true

[features]
default = []
k8s = []
docker = []
mdns = []
dns-sd = []

[dependencies]
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = { version = "0.14", default-features = false, features = ["toml", "json", "yaml"] }  # Only formats we use
toml = "0.8"
tracing = "0.1"
anyhow = "1.0"
thiserror = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
rand = { workspace = true }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
gethostname = "0.4"
hickory-resolver = { workspace = true }
mdns-sd = "0.10"
hostname = "0.4"

# [target.'cfg(unix)'.dependencies]
# libc removed - not used, evolved to pure Rust alternatives

[dev-dependencies]
tempfile = "3.0"
tracing-subscriber = "0.3"
songbird-test-utils = { path = "../songbird-test-utils" }
