[package]
name = "songbird-types"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
description = "Universal types and structures for the Songbird orchestrator"
readme = "../../README.md"
keywords = ["types", "traits", "distributed", "orchestration", "gaming"]
categories = ["data-structures", "api-bindings", "development-tools"]

# Inherit workspace lints for evolutionary constraints
[lints]
workspace = true

[features]
default = ["serde", "chrono"]
serde = ["dep:serde", "dep:serde_json"]
chrono = ["dep:chrono"]
reqwest = ["dep:reqwest"]
tokio = ["dep:tokio"]

[dependencies]
# Foundation layer has minimal external dependencies
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
async-trait = "0.1"
serde_json = { version = "1.0", optional = true }
# Added for consolidated types from federation and primal communication
chrono = { version = "0.4", features = ["serde"], optional = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
num_cpus = "1.0"
bitflags = "2.0"
regex = "1.0"
reqwest = { version = "0.11", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "comprehensive_unification_benchmarks"
harness = false
path = "../../benches/comprehensive_unification_benchmarks.rs"
required-features = ["serde"]
