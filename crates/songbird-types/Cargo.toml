[package]
name = "songbird-types"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
description = "Universal types and structures for the Songbird orchestrator"
readme = "../../README.md"
keywords = ["types", "traits", "distributed", "orchestration", "gaming"]
categories = ["data-structures", "api-bindings", "development-tools"]

# Inherit workspace lints for evolutionary constraints
[lints]
workspace = true

[features]
default = ["serde", "chrono"]
serde = ["dep:serde", "dep:serde_json"]
chrono = ["dep:chrono"]
# REMOVED: reqwest feature - migrated to songbird-http-client (Pure Rust IPC)
# reqwest = ["dep:reqwest"]
tests-incomplete = []  # Feature flag for incomplete tests
unsafe-reference = []  # Feature flag for deprecated unsafe SafeZeroCopyBuffer (test-only)

[dependencies]
# Foundation layer has minimal external dependencies
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
async-trait = "0.1"
serde_json = { version = "1.0", optional = true }
# Added for consolidated types from federation and primal communication
chrono = { version = "0.4", features = ["serde"], optional = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
num_cpus = "1.0"
bitflags = { workspace = true }
regex = "1.0"
# REMOVED: reqwest - migrated to songbird-http-client (Pure Rust IPC via Unix sockets)
# reqwest = { version = "0.11", features = ["json"], default-features = false, optional = true }
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
serde_yaml = "0.9"
# Performance optimizations
arrayvec = "0.7"
# Added for consolidated traits Stream support
futures-util = "0.3"
# Added for canonical adapters
rand = { workspace = true }
# Hostname detection for federation
hostname = "0.3"
# Base64 encoding for lineage proofs
base64 = "0.21"

[dev-dependencies]
songbird-process-env.workspace = true
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3.0"
songbird-test-utils = { path = "../songbird-test-utils" }
songbird-config = { path = "../songbird-config" }


# Using workspace lints configuration
