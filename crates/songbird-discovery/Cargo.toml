[package]
name = "songbird-discovery"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Network discovery and service registry for Songbird"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["discovery", "networking", "service-registry", "distributed", "gaming"]
categories = ["network-programming", "game-engines", "web-programming"]


[lints]
workspace = true

[dependencies]
# Internal dependencies
# songbird-security-errors = { path = "../songbird-security-errors" }  # REMOVED: Using unified errors from songbird-types
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-universal = { path = "../songbird-universal" }  # Includes UnixRpcClient (Pure Rust!)

# External dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.11", features = ["json"], default-features = false }  # ✅ No TLS (Pure Rust!)  # ✅ Pure Rust!
base64 = "0.21"  # For BearDog BirdSong provider
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
hickory-resolver = { workspace = true }
num_cpus = { workspace = true }
sha2 = "0.10"  # For session ID generation in anonymous discovery
anyhow = "1.0"  # For lineage discovery error handling
hex = "0.4"  # For discovery packet hashing
socket2 = "0.5"  # For multicast socket configuration

[dev-dependencies]
tracing-subscriber = "0.3"

