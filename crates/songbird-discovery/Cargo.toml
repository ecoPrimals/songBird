[package]
name = "songbird-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Network discovery and service registry for Songbird"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["discovery", "networking", "service-registry", "distributed", "gaming"]
categories = ["network-programming", "game-engines", "web-programming"]


[lints]
workspace = true

[dependencies]
# Internal dependencies
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-universal = { path = "../songbird-universal" }  # Includes UnixRpcClient (Pure Rust!)
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!
songbird-crypto-provider = { path = "../songbird-crypto-provider" }

# External dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

tracing = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"  # For security-provider BirdSong encoding
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
hickory-resolver = { workspace = true }
sha2 = "0.10"  # For session ID generation in anonymous discovery
anyhow = { workspace = true }  # For lineage discovery error handling
hex = "0.4"  # For discovery packet hashing
socket2 = { workspace = true }  # For multicast socket configuration (aligned with workspace 0.6)
# `pure`: pure Rust BLAKE3 (no C/assembly build) for ecoBin compliance
blake3 = { version = "1.5", default-features = false, features = ["std", "pure"] }
hostname = "0.4"  # For primal self-knowledge name introspection
getrandom = { workspace = true }  # Cryptographically secure random nonce for beacon encryption
rand = { workspace = true }

[features]
default = []

security = []
storage = []
compute = []
ai = []
discovery = []
orchestration = []
dns-srv = []

[dev-dependencies]
songbird-test-utils = { path = "../songbird-test-utils" }
tracing-subscriber = { workspace = true }

