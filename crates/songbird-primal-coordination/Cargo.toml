[package]
name = "songbird-primal-coordination"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals Team"]
description = "Agnostic primal coordination - Songbird as universal signal and coordinator"
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["coordination", "distributed", "mesh", "primals", "sovereignty"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["full"] }
# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Time and UUIDs
uuid = { workspace = true }

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
