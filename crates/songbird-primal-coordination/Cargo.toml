[package]
name = "songbird-primal-coordination"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ecoPrimals Team"]
description = "Agnostic primal coordination - Songbird as universal signal and coordinator"
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["coordination", "distributed", "mesh", "primals", "sovereignty"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Time and UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (✅ Pure Rust TLS!)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-discovery = { path = "../songbird-discovery" }

[dev-dependencies]
tokio-test = "0.4"
