[package]
name = "songbird-primal-coordination"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0"
authors = ["ecoPrimals Team"]
description = "Agnostic primal coordination - Songbird as universal signal and coordinator"
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["coordination", "distributed", "mesh", "primals", "sovereignty"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Time and UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!

[dev-dependencies]
tokio-test = "0.4"
