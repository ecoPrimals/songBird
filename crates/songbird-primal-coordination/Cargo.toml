[package]
name = "songbird-primal-coordination"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ecoPrimals Team"]
description = "Agnostic primal coordination - Songbird as universal signal and coordinator"

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Time and UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-discovery = { path = "../songbird-discovery" }

[dev-dependencies]
tokio-test = "0.4"
