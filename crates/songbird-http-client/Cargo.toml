[package]
name = "songbird-http-client"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Pure Rust HTTP/HTTPS client using BearDog crypto delegation (Tower Atomic)"
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
keywords = ["http", "https", "tls", "pure-rust", "tower-atomic"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
# Core songbird types (defaults for socket discovery)
songbird-types = { path = "../songbird-types" }
# HTTP protocol (Pure Rust)
hyper = { version = "1.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http = "1.0"
http-body-util = "0.1"

# Async runtime
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Utilities
tracing = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
bytes = "1.0"
anyhow = "1.0"
async-trait = { workspace = true }

# Cryptography (Pure Rust)
sha2 = "0.10"
hex = "0.4"

# Secure random number generation (Pure Rust)
getrandom = { workspace = true }  # OS-provided CSPRNG
fastrand = { workspace = true }    # Fast fallback RNG


[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3.0"
wiremock = "0.6"
tracing-subscriber = { workspace = true }
rand = "0.8"

[[example]]
name = "simple_get"
path = "examples/simple_get.rs"

[[example]]
name = "https_test"
path = "examples/https_test.rs"

