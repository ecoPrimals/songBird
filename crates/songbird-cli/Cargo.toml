[package]
name = "songbird-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Command-line interface for Songbird orchestrator"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["cli", "command-line", "gaming", "orchestration", "tools"]
categories = ["command-line-utilities", "game-engines", "development-tools"]


[lints]
workspace = true

[[bin]]
name = "songbird-cli"
path = "src/bin/songbird.rs"

[[bin]]
name = "gaming-demo"
path = "src/bin/gaming_demo.rs"
doc = false

[[bin]]
name = "test-runner"
path = "src/bin/test_runner.rs"
doc = false

[dependencies]
# Core songbird dependencies - NOW INCLUDES ORCHESTRATOR FOR STANDALONE BINARY
songbird-types = { path = "../songbird-types" }  # Added for unified types
songbird-config = { path = "../songbird-config" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-network-federation = { path = "../songbird-network-federation" }  # ENABLED: Network capabilities
songbird-observability = { path = "../songbird-observability" }
songbird-orchestrator = { path = "../songbird-orchestrator" }  # ✅ ADDED: For standalone binary (no cargo run)

# External dependencies
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
dirs = "5.0"
whoami = "1.4"
hostname = "0.3"
rand = "0.8"
num_cpus = "1.16"
term_size = "0.3"
libc = "0.2"
tokio = { workspace = true }
fastrand = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
reqwest = { version = "0.11", features = ["json"], default-features = false }  # ✅ No TLS (Pure Rust!)
tracing = "0.1"
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
sysinfo = "0.30"
uuid = { version = "1.6", features = ["v4"] }
thiserror = "1.0"
futures-util = "0.3"
regex = "1.10"
tracing-subscriber = "0.3"
atty = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }  # ✅ No cmake dependency! (ring = vetted BoringSSL subset)
anyhow = "1.0"   # ✅ ADDED: For error handling

[features]
default = ["reqwest"]
reqwest = []

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

