[package]
name = "songbird-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Command-line interface for Songbird orchestrator"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["cli", "command-line", "gaming", "orchestration", "tools"]
categories = ["command-line-utilities", "game-engines", "development-tools"]


[lints]
workspace = true

[[bin]]
name = "songbird-cli"
path = "src/bin/songbird.rs"

[[bin]]
name = "gaming-demo"
path = "src/bin/gaming_demo.rs"
doc = false

[[bin]]
name = "test-runner"
path = "src/bin/test_runner.rs"
doc = false

[dependencies]
# Core songbird dependencies - NOW INCLUDES ORCHESTRATOR FOR STANDALONE BINARY
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }  # Added for unified types
songbird-config = { path = "../songbird-config" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-network-federation = { path = "../songbird-network-federation" }  # ENABLED: Network capabilities
songbird-observability = { path = "../songbird-observability" }
songbird-orchestrator = { path = "../songbird-orchestrator" }  # ✅ ADDED: For standalone binary (no cargo run)

# External dependencies
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
whoami = "1.4"
hostname = "0.4"
rand = "0.8"
term_size = "0.3"
# libc removed - not used, evolved to pure Rust alternatives
tokio = { workspace = true }
fastrand = { workspace = true }
clap = { version = "4.0", features = ["derive", "env"] }
colored = "2.0"
songbird-http-client = { path = "../songbird-http-client" }
hickory-resolver = { workspace = true }
tracing = "0.1"
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
uuid = { version = "1.6", features = ["v4"] }
thiserror = { workspace = true }
futures-util = "0.3"
regex = "1.10"
tracing-subscriber = "0.3"
# TLS provider: rustls-rustcrypto (pure Rust, zero C) by default.
# The `ring-crypto` feature below enables `rustls/ring` for environments without
# BearDog (standalone testing only). Production MUST use BearDog via Tower Atomic.
# SB-02: songbird-quic is ring-free (BearDogQuicCrypto); only this CLI crate
# retains the opt-in gate for offline bootstrap scenarios.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
anyhow = "1.0"

[features]
default = []
# ⚠️  OPT-IN ONLY — pulls `ring` (C/ASM via `cc`, violates ecoBin).
# Use for standalone testing without BearDog crypto delegation.
# Production builds MUST NOT enable this; BearDog handles all crypto via IPC.
ring-crypto = ["rustls/ring"]

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

