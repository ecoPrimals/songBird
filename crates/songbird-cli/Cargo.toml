[package]
name = "songbird-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Command-line interface for Songbird orchestrator"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["cli", "command-line", "gaming", "orchestration", "tools"]
categories = ["command-line-utilities", "game-engines", "development-tools"]


[lints]
workspace = true

[[bin]]
name = "songbird-cli"
path = "src/bin/songbird.rs"

[[bin]]
name = "gaming-demo"
path = "src/bin/gaming_demo.rs"
doc = false

[[bin]]
name = "test-runner"
path = "src/bin/test_runner.rs"
doc = false

[dependencies]
# Core songbird dependencies - NOW INCLUDES ORCHESTRATOR FOR STANDALONE BINARY
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }  # Added for unified types
songbird-config = { path = "../songbird-config" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-network-federation = { path = "../songbird-network-federation" }  # ENABLED: Network capabilities
songbird-observability = { path = "../songbird-observability" }
songbird-orchestrator = { path = "../songbird-orchestrator" }  # ✅ ADDED: For standalone binary (no cargo run)

# External dependencies
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
whoami = "1.4"
hostname = "0.4"
rand = { workspace = true }
term_size = "0.3"
# libc removed - not used, evolved to pure Rust alternatives
tokio = { workspace = true }
fastrand = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
songbird-http-client = { path = "../songbird-http-client" }
hickory-resolver = { workspace = true }
tracing = { workspace = true }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
uuid = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true }
# TLS provider: rustls-rustcrypto (pure Rust, zero C — ecoBin compliant).
# SB-02 RESOLVED: ring-crypto opt-in feature removed (Wave 135). rustls_rustcrypto is
# sufficient for both production (Tower Atomic delegation) and standalone bootstrap.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
anyhow = { workspace = true }

[features]
default = []

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

