[package]
name = "songbird-network-federation"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Consolidated network and federation layer for Songbird Universal Orchestrator"
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
readme = "../../README.md"
keywords = ["networking", "federation", "gaming", "distributed", "orchestration"]
categories = ["network-programming", "game-engines", "distributed-systems"]


[lints]
workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true }
async-trait.workspace = true
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Networking (✅ 100% Pure Rust!)
songbird-http-client = { path = "../songbird-http-client" }
url = "2.5"

# TLS/HTTPS support - REMOVED! Using songbird-tls instead (100% Pure Rust!)
# ❌ REMOVED (Jan 19, 2026):
#   - rustls-tls feature → hyper-rustls → rustls → ring (C code)
#   - rustls, rustls-pemfile, tokio-rustls (all had C dependencies via ring/aws-lc-rs)
#   - rcgen (uses ring for crypto)
# ✅ NOW: songbird-tls handles all TLS (delegated to BearDog for Pure Rust crypto)

# Random number generation (missing dependency that caused errors)
fastrand = "2.0"

# Logging
tracing = { workspace = true }

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-universal = { path = "../songbird-universal" }
# songbird-security-errors = { path = "../songbird-security-errors" }  # REMOVED: Using unified errors from songbird-types
songbird-discovery = { path = "../songbird-discovery" }
# ⚠️ TRUE PRIMAL: Crypto for local BTSP testing only (optional)
aes-gcm = { version = "0.10.3", optional = true }
generic-array = { version = "1.0", optional = true }
rand.workspace = true

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["gaming", "federation", "local-btsp"]  # Include local-btsp for backward compat
gaming = []
federation = []
local-btsp = ["aes-gcm", "generic-array"]  # ⚠️ Local BTSP testing (uses crypto) - production uses BearDog!
# Removed legacy-compat feature flag - migration complete 
