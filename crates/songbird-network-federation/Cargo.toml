[package]
name = "songbird-network-federation"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Consolidated network and federation layer for Songbird Universal Orchestrator"
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
readme = "../../README.md"
keywords = ["networking", "federation", "gaming", "distributed", "orchestration"]
categories = ["network-programming", "game-engines", "distributed-systems"]


[lints]
workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true }
async-trait.workspace = true
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Networking (✅ Pure Rust TLS!)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
url = "2.5"

# TLS/HTTPS support - REMOVED! Using songbird-tls instead (100% Pure Rust!)
# Was: rustls, rustls-pemfile, tokio-rustls (all had C dependencies via ring/aws-lc-rs)
# Now: songbird-tls handles all TLS (delegated to BearDog for crypto)
rcgen = "0.14"  # Pure Rust cert generation (standalone, no deps!)

# Random number generation (missing dependency that caused errors)
fastrand = "2.0"

# Logging
tracing = { workspace = true }

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
# songbird-security-errors = { path = "../songbird-security-errors" }  # REMOVED: Using unified errors from songbird-types
songbird-discovery = { path = "../songbird-discovery" }
aes-gcm = "0.10.3"
generic-array = "1.0"
rand.workspace = true

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["gaming", "federation"]
gaming = []
federation = []
# Removed legacy-compat feature flag - migration complete 
