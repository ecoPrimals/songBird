[package]
name = "songbird-network-federation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Consolidated network and federation layer for Songbird Universal Orchestrator"
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
readme = "../../README.md"
keywords = ["networking", "federation", "gaming", "distributed", "orchestration"]
categories = ["network-programming", "game-engines", "distributed-systems"]


[lints]
workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Networking (✅ 100% Pure Rust!)
songbird-http-client = { path = "../songbird-http-client" }
url = "2.5"

# Random number generation (missing dependency that caused errors)
fastrand = { workspace = true }

# Logging
tracing = { workspace = true }

# Time and date handling
chrono = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"

# Serialization (peers.toml persistence loading)
toml = { workspace = true }

# Internal dependencies
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-universal = { path = "../songbird-universal" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
# ⚠️ TRUE PRIMAL: Crypto for local BTSP testing only (optional)
aes-gcm = { version = "0.10.3", optional = true }
generic-array = { version = "1.0", optional = true }
rand.workspace = true

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["local-btsp"]
local-btsp = ["aes-gcm", "generic-array"]
test-mocks = []
