[package]
name = "songbird-canonical"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
description = "Canonical type system and patterns for the Songbird ecosystem"
readme = "../../README.md"
keywords = ["canonical", "types", "patterns", "ecosystem", "rust"]
categories = ["data-structures", "development-tools", "network-programming"]


[lints]
workspace = true

[dependencies]
# Core async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
songbird-types = { path = "../songbird-types" }

# Logging and tracing
tracing = { workspace = true }

# Validation
validator = "0.20"  # Updated to latest version to fix idna vulnerability

# Time handling
chrono = { workspace = true }

# Internal dependencies
songbird-config = { path = "../songbird-config" }

[features]
default = ["std"]
std = []

[dev-dependencies]
songbird-test-utils = { path = "../songbird-test-utils" }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-test = "0.4"
tempfile = { workspace = true }
