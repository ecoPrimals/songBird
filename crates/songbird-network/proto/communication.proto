syntax = "proto3";

package songbird.communication;

// Generic message structure for inter-service communication
message GenericMessage {
    // Unique message identifier
    string id = 1;
    
    // Message type (e.g., "service_request", "heartbeat", "notification")
    string message_type = 2;
    
    // JSON-encoded payload
    string payload = 3;
    
    // Message headers
    map<string, string> headers = 4;
    
    // ISO 8601 timestamp
    string timestamp = 5;
}

// Generic response structure
message GenericResponse {
    // Response identifier (matches request id)
    string id = 1;
    
    // HTTP-style status code
    int32 status = 2;
    
    // JSON-encoded response payload
    string payload = 3;
    
    // Response headers
    map<string, string> headers = 4;
}

// Communication service for inter-service messaging
service CommunicationService {
    // Send a message and get response
    rpc SendMessage(GenericMessage) returns (GenericResponse);
    
    // Stream messages (for real-time communication)
    rpc StreamMessages(stream GenericMessage) returns (stream GenericResponse);
    
    // Health check
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Health check request
message HealthCheckRequest {
    string service_name = 1;
}

// Health check response
message HealthCheckResponse {
    enum Status {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
        SERVICE_UNKNOWN = 3;
    }
    
    Status status = 1;
    string message = 2;
} 