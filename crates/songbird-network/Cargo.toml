[package]
name = "songbird-network"
version = "0.1.0"
edition = "2021"
authors = ["Songbird Team"]
description = "Network layer for Songbird - VPN, TLS, and secure transport"

[dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Async runtime
async-trait = "0.1"

# Cryptography
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.21"

# TLS
rustls = "0.23"
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
rcgen = "0.13"  # For self-signed cert generation
pem = "3.0"

# Networking
socket2 = "0.5"

# Configuration
toml = "0.8"

# Songbird types
songbird-types = { path = "../songbird-types" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"

