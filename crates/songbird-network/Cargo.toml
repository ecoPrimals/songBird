[package]
name = "songbird-network"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Network management and communication for Songbird"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["networking", "proxy", "load-balancing", "circuit-breaker", "gaming"]
categories = ["network-programming", "game-engines", "web-programming"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP and web framework
axum = { version = "0.7", features = ["ws", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
http = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Random number generation
rand = "0.8"

# Network utilities
bytes = "1.0"
pnet = "0.33"

# Cryptography
ring = "0.16"
x25519-dalek = "=2.0.0-rc.3"
boringtun = "0.6"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"

# Songbird crates
songbird-config = { path = "../songbird-config" }
songbird-errors = { path = "../songbird-errors" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-universal-primals = { path = "../songbird-universal-primals" }

# Network discovery
mdns = "3.0"
uuid = "1.0"
libc = "0.2"

# Performance
parking_lot = "0.12"

# System utilities
byteorder = "1.4"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

[features]
beardog = []

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
