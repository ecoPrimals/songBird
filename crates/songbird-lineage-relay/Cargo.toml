[package]
name = "songbird-lineage-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["lineage", "relay", "genetic", "p2p", "connectivity"]
categories = ["network-programming", "distributed-systems"]  # Removed "cryptography" - delegates to BearDog!
description = "Genetic lineage-based relay system - evolution beyond NAT/STUN/TURN"
authors = ["ecoPrimals Team"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
futures = "0.3"
base64 = "0.22"

# Internal dependencies
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-primal-coordination = { path = "../songbird-primal-coordination" }
songbird-stun = { path = "../songbird-stun" }

[lints]
workspace = true

[features]
default = []
## Expose mock types for integration tests (`MockLineageProvider`, etc.)
test-utils = []

[dev-dependencies]
tokio-test = "0.4"
songbird-lineage-relay = { path = ".", features = ["test-utils"] }

[lib]
path = "src/lib.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

