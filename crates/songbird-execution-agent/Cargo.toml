[package]
name = "songbird-execution-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Distributed task execution agent for Songbird orchestrator"
readme = "../README.md"
keywords = ["orchestration", "distributed", "execution", "async"]
categories = ["asynchronous", "network-programming"]

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["full", "process"] }
async-trait = { workspace = true }

# HTTP server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling & types
songbird-types = { path = "../songbird-types" }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging & tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# Time handling
chrono = { workspace = true }

# UUID generation
uuid = { workspace = true, features = ["v4", "serde"] }

# Process management
nix = { version = "0.29", features = ["process", "signal"] }

# HTTP client (✅ 100% Pure Rust!)
songbird-http-client = { path = "../songbird-http-client" }

[dev-dependencies]
songbird-http-client = { path = "../songbird-http-client" }
