[package]
name = "songbird-lib"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Songbird Universal Orchestrator - Main library aggregating all components"
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
readme = "../../README.md"
keywords = ["gaming", "orchestration", "networking", "distributed", "bridge"]
categories = ["game-engines", "network-programming", "web-programming"]

[dependencies]
# All songbird crates that lib.rs re-exports
songbird-cli = { path = "../songbird-cli" }
songbird-config = { path = "../songbird-config" }
songbird-core = { path = "../songbird-core" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-errors = { path = "../songbird-errors" }
# songbird-federation = { path = "../songbird-federation" } # Temporarily disabled
songbird-network = { path = "../songbird-network" }
songbird-observability = { path = "../songbird-observability" }
songbird-registry = { path = "../songbird-registry" }
# songbird-security = { path = "../songbird-security" } # Temporarily disabled
songbird-universal = { path = "../songbird-universal" }
songbird-universal-primals = { path = "../songbird-universal-primals" } 