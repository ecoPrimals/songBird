[package]
name = "songbird-registry"
version.workspace = true
edition.workspace = true
description = "High-performance universal service registry with zero-cost abstractions and capability-based discovery"
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
keywords = ["orchestration", "service-discovery", "registry", "microservices", "distributed"]
categories = ["network-programming", "web-programming", "development-tools"]

[features]
# Used by `cfg(feature = "tests-incomplete")` in opt-in incomplete integration tests.
tests-incomplete = []

[lints]
workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# System monitoring

# HTTP client (✅ Pure Rust TLS 1.3!)
songbird-http-client = { path = "../songbird-http-client" }  # ✅ Pure Rust, ecoBin compliant!

# Internal dependencies
anyhow = { workspace = true }
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-config = { path = "../songbird-config" }

[dev-dependencies]
tokio-test = "0.4"
