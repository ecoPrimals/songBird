[package]
name = "songbird-remote-deploy"
version.workspace = true
edition.workspace = true
description = "Agnostic remote service deployment via SSH for Songbird federation"
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["deployment", "distributed", "orchestration", "remote", "ssh"]
categories = ["network-programming", "development-tools::build-utils"]

[[bin]]
name = "songbird-deploy"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Internal dependencies
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-http-client = { path = "../songbird-http-client" }

[lints]
workspace = true

