[package]
name = "songbird-remote-deploy"
version.workspace = true
edition.workspace = true
description = "Agnostic remote service deployment via SSH for Songbird federation"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["deployment", "distributed", "orchestration", "remote", "ssh"]
categories = ["network-programming", "development-tools::build-utils"]

[[bin]]
name = "songbird-deploy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal dependencies
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust with multipart!

