[package]
name = "songbird-remote-deploy"
version = "0.1.0"
edition = "2021"
description = "Agnostic remote service deployment via SSH for Songbird federation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["deployment", "distributed", "orchestration", "remote", "ssh"]
categories = ["network-programming", "development-tools::build-utils"]

[[bin]]
name = "songbird-deploy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "multipart"], default-features = false }  # ✅ No TLS (Pure Rust!)
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

