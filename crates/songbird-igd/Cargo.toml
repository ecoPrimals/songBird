[package]
name = "songbird-igd"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Pure Rust UPnP IGD and NAT-PMP router configuration for Songbird"
readme = "../README.md"
keywords = ["upnp", "igd", "nat-pmp", "port-forwarding", "pure-rust"]
categories = ["network-programming"]

[dependencies]
# Async runtime (Pure Rust)
tokio = { workspace = true, features = ["net", "time", "io-util", "macros", "rt"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Internal dependencies
songbird-types = { path = "../songbird-types" }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-test = "0.4"

[lib]
name = "songbird_igd"
path = "src/lib.rs"

# Enforce Pure Rust - zero unsafe code
[[package.metadata.enforce]]
no_unsafe = true
no_c_dependencies = true
