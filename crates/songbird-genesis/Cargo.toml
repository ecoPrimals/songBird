[package]
name = "songbird-genesis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eastgate/songbird"
readme = "README.md"
keywords = ["genesis", "bootstrap", "security", "cryptography"]
categories = ["cryptography", "authentication"]
description = "Physical genesis bootstrap for Songbird nodes with multi-primal witness coordination"
authors = ["ecoPrimals Team"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Hardware Keys
webauthn-rs = { version = "0.4", optional = true }           # FIDO2/WebAuthn for SoloKey

# Physical Channels
qrcode = { version = "0.13", optional = true }               # QR code generation
image = { version = "0.24", optional = true }                # QR code image handling
rqrr = { version = "0.6", optional = true }                  # QR code scanning
btleplug = { version = "0.11", optional = true }             # Bluetooth LE

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Internal dependencies (will add as we build)
# songbird-types = { path = "../songbird-types" }
# songbird-network-federation = { path = "../songbird-network-federation" }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[features]
default = ["solokey", "qr"]  # Bluetooth opt-in for zero system deps
solokey = ["webauthn-rs"]
qr = ["qrcode", "image", "rqrr"]
bluetooth = ["btleplug"]  # Opt-in: Linux requires libdbus-1-dev
nfc = []  # Future: NFC support

