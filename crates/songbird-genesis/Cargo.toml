[package]
name = "songbird-genesis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["genesis", "bootstrap", "security", "usb"]  # Removed "cryptography" - delegates to security provider
categories = ["hardware-support", "authentication"]  # Removed "cryptography" - delegates to security provider
description = "Physical genesis bootstrap for Songbird nodes with multi-primal witness coordination"
authors = ["ecoPrimals Team"]

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Cryptography & Hardware Keys
# Future: SoloKey support will use Pure Rust FIDO2/WebAuthn implementation

# Physical Channels
qrcode = { version = "0.13", optional = true }               # QR code generation
image = { version = "0.24", optional = true }                # QR code image handling
rqrr = { version = "0.6", optional = true }                  # QR code scanning
btleplug = { version = "0.11", optional = true }             # Bluetooth LE

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Internal dependencies
songbird-process-env.workspace = true
songbird-bluetooth = { path = "../songbird-bluetooth", optional = true, features = ["usb-rust"] }
songbird-primal-coordination = { path = "../songbird-primal-coordination", optional = true }
songbird-config = { path = "../songbird-config", optional = true }
songbird-types = { path = "../songbird-types", optional = true }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!

# Cryptography (local fallback — prefer bearDog UDS delegation via songbird-http-client)
sha2 = { workspace = true, optional = true }
hex = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[features]
default = ["qr", "pure-bluetooth", "capability-discovery", "local-crypto-fallback"]  # Pure Rust - zero system deps!
local-crypto-fallback = ["dep:sha2"]  # Embed sha2 for offline/bootstrap (production: bearDog delegates)
# Opt-in: hardware-key channel types — CTAP2/FIDO2 not integrated (returns SoloKeyNotIntegrated; see `physical_channels::solokey`).
solokey = []
qr = ["qrcode", "image", "rqrr"]
# Legacy btleplug stack (system dbus on Linux). Prefer `pure-bluetooth`.
legacy-bluetooth = ["btleplug"]
bluetooth = ["legacy-bluetooth"]  # Alias for `legacy-bluetooth`
pure-bluetooth = ["songbird-bluetooth"]  # Pure Rust BLE - universal!
coordination = ["songbird-primal-coordination"]  # Agnostic primal coordination
capability-discovery = ["songbird-config", "songbird-types"]  # Runtime capability discovery
# Exposes `MockPhysicalChannel` / `PhysicalChannel::Mock` for integration tests.
test-mocks = []

