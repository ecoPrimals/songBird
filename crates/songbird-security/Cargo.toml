[package]
name = "songbird-security"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Security and authentication for Songbird components"
readme = "../../README.md"
keywords = ["security", "authentication", "encryption", "gaming", "beardog"]
categories = ["cryptography", "network-programming", "game-engines"]

[dependencies]
songbird-errors = { path = "../songbird-errors" }
songbird-config = { path = "../songbird-config" }
songbird-network = { path = "../songbird-network" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"
ring = "0.17"
colored = "2.0"
bytes = "1.0"
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
thiserror = "1.0"
bincode = "1.3"
urlencoding = "2.1"
rand = "0.8"
