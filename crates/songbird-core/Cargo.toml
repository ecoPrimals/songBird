[package]
name = "songbird-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Core orchestration engine for Songbird"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["orchestration", "gaming", "microservices", "distributed", "rust"]
categories = ["game-engines", "network-programming", "concurrency"]

[dependencies]
songbird-errors = { path = "../songbird-errors" }
songbird-config = { path = "../songbird-config" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-types = { path = "../songbird-types" }
# songbird-network = { path = "../songbird-network" } # Temporarily disabled for deep work
songbird-observability = { path = "../songbird-observability" }
songbird-registry = { path = "../songbird-registry" }
songbird-universal = { path = "../songbird-universal" }
songbird-universal-primals = { path = "../songbird-universal-primals" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
async-trait = { workspace = true }
futures = { version = "0.3" }
futures-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sysinfo = "0.30"
parking_lot = { workspace = true }
num_cpus = "1.16"
fastrand = "2.0"
rand = "0.8"
reqwest = { workspace = true, features = ["json"] }
serde_yaml = "0.9.34"
axum = "0.7"
tokio-stream = "0.1"
tower-http = { version = "0.4", features = ["cors", "trace"] }
async-stream = "0.3"
md5 = "0.7"

[dev-dependencies]
axum-test = "15.7.1"
tokio-test = "0.4"
tracing-subscriber = { workspace = true }

[[example]]
name = "metrics_capability_adapter_demo"
path = "../../examples/metrics_capability_adapter_demo.rs"
