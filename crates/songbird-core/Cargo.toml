[package]
name = "songbird-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Core orchestration engine for Songbird"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["orchestration", "gaming", "microservices", "distributed", "rust"]
categories = ["game-engines", "network-programming", "concurrency"]

[dependencies]
songbird-errors = { path = "../songbird-errors" }
songbird-config = { path = "../songbird-config" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-observability = { path = "../songbird-observability" }
songbird-registry = { path = "../songbird-registry" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
num_cpus = "1.16"
sys-info = "0.9.1"
fastrand = "2.0"
rand = "0.8"
reqwest = { workspace = true, features = ["json"] }
serde_yaml = "0.9.34"
