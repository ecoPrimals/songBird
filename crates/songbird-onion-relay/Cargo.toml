[package]
name = "songbird-onion-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Sovereign onion relay - Pure Rust NAT traversal without Arti"
readme = "../README.md"
keywords = ["onion", "relay", "songbird", "nat-traversal", "tor"]
categories = ["network-programming", "cryptography"]

# ARCHITECTURE EVOLUTION (Feb 6, 2026):
# =====================================
# Arti dependency REMOVED. Using Songbird Sovereign Onion Service instead.
# 
# - Binary size: ~5MB → ~200KB (25x smaller)
# - Startup time: 10-30s → instant (no Tor bootstrap)
# - Crypto: Delegated to BearDog (TRUE PRIMAL pattern)
# - Dependencies: Pure Rust, no external network requirements
#
# See: biomeOS/docs/handoffs/BEARDOG_ONION_CRYPTO_HANDOFF_FEB06_2026.md
# See: biomeOS/docs/handoffs/SOVEREIGN_BEACON_MESH_HANDOFF_FEB06_2026.md

[features]
default = []
# Sovereign Onion Service (Pure Rust, BearDog crypto delegation)
# Enable with `--features onion` for .onion address support
# `standalone` enables `OnionStorage::load_or_generate_identity` for sync transport init
# (production paths use `load_or_generate_identity_via_beardog` async API).
onion = ["songbird-sovereign-onion", "songbird-sovereign-onion/standalone"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Sovereign Onion Service (optional - Pure Rust, delegates crypto to BearDog)
# Unlike Arti, this is lightweight (~200KB) and starts instantly
songbird-sovereign-onion = { path = "../songbird-sovereign-onion", optional = true }

# Internal crates
songbird-stun = { path = "../songbird-stun" }
songbird-lineage-relay = { path = "../songbird-lineage-relay" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
