[package]
name = "songbird-onion-relay"
version = "0.1.0"
edition = "2021"
description = "Sovereign rendezvous via Tor onion services - Pure Rust"
license = "AGPL-3.0"

[features]
default = []
# Full Tor integration (adds ~5MB to binary)
tor = ["arti-client", "tor-hsservice", "tor-rtcompat"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Tor (optional - enable with `tor` feature)
arti-client = { version = "0.24", optional = true }
tor-hsservice = { version = "0.24", optional = true }
tor-rtcompat = { version = "0.24", features = ["tokio"], optional = true }

# Internal crates
songbird-stun = { path = "../songbird-stun" }
songbird-lineage-relay = { path = "../songbird-lineage-relay" }

[dev-dependencies]
tokio-test = "0.4"
