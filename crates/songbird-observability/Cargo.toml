[package]
name = "songbird-observability"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Observability and monitoring for Songbird components"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["observability", "monitoring", "metrics", "tracing", "gaming"]
categories = ["development-tools", "network-programming", "game-engines"]


[lints]
workspace = true

[dependencies]
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
bytes = "1.5"
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
serde_json = { workspace = true }
async-trait = { workspace = true }

