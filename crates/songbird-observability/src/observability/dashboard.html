<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songbird Universal Orchestrator - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #3498db;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .metric-card.health {
            border-left-color: #27ae60;
        }

        .metric-card.performance {
            border-left-color: #e74c3c;
        }

        .metric-card.network {
            border-left-color: #9b59b6;
        }

        .metric-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric-value {
            font-size: 2em;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 10px;
        }

        .metric-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-healthy {
            background-color: #27ae60;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.5);
        }

        .status-warning {
            background-color: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        .status-critical {
            background-color: #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-style: italic;
        }

        .error {
            background-color: #fee;
            color: #c0392b;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin: 20px 0;
        }

        .last-updated {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .updating {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎼 Songbird Universal Orchestrator</h1>
            <div class="subtitle">Real-time System Monitoring Dashboard</div>
        </div>

        <div id="dashboard-content">
            <div class="loading">
                <div>Loading system metrics...</div>
            </div>
        </div>

        <div class="last-updated" id="last-updated">
            <!-- Last updated time will be inserted here -->
        </div>
    </div>

    <script>
        class SongbirdDashboard {
            constructor() {
                this.updateInterval = 5000; // 5 seconds
                this.isUpdating = false;
                this.init();
            }

            init() {
                this.loadAllData();
                setInterval(() => this.loadAllData(), this.updateInterval);
            }

            async loadAllData() {
                if (this.isUpdating) return;
                
                this.isUpdating = true;
                const contentEl = document.getElementById('dashboard-content');
                contentEl.classList.add('updating');

                try {
                    const [metrics, health, status] = await Promise.all([
                        this.fetchData('/api/metrics'),
                        this.fetchData('/api/health'),
                        this.fetchData('/api/status')
                    ]);

                    this.renderDashboard(metrics, health, status);
                    this.updateLastUpdatedTime();
                } catch (error) {
                    this.renderError(`Failed to load dashboard data: ${error.message}`);
                } finally {
                    contentEl.classList.remove('updating');
                    this.isUpdating = false;
                }
            }

            async fetchData(endpoint) {
                const response = await fetch(endpoint);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            }

            renderDashboard(metrics, health, status) {
                const html = `
                    <div class="metrics-grid">
                        <div class="metric-card health">
                            <div class="metric-title">
                                <span class="status-indicator ${this.getStatusClass(health.status)}"></span>
                                System Health
                            </div>
                            <div class="metric-value">${health.status}</div>
                            <div class="metric-label">Response Time: ${health.response_time_ms}ms</div>
                        </div>

                        <div class="metric-card performance">
                            <div class="metric-title">
                                <span class="status-indicator status-healthy"></span>
                                CPU Usage
                            </div>
                            <div class="metric-value">${metrics.cpu_usage.toFixed(1)}%</div>
                            <div class="metric-label">System processor utilization</div>
                        </div>

                        <div class="metric-card performance">
                            <div class="metric-title">
                                <span class="status-indicator status-healthy"></span>
                                Memory Usage
                            </div>
                            <div class="metric-value">${metrics.memory_usage.toFixed(1)}%</div>
                            <div class="metric-label">RAM utilization</div>
                        </div>

                        <div class="metric-card performance">
                            <div class="metric-title">
                                <span class="status-indicator status-healthy"></span>
                                Disk Usage
                            </div>
                            <div class="metric-value">${metrics.disk_usage.toFixed(1)}%</div>
                            <div class="metric-label">Storage utilization</div>
                        </div>

                        <div class="metric-card network">
                            <div class="metric-title">
                                <span class="status-indicator status-healthy"></span>
                                Network I/O
                            </div>
                            <div class="metric-value">${this.formatBytes(metrics.network_io.bytes_in + metrics.network_io.bytes_out)}</div>
                            <div class="metric-label">In: ${this.formatBytes(metrics.network_io.bytes_in)} | Out: ${this.formatBytes(metrics.network_io.bytes_out)}</div>
                        </div>

                        <div class="metric-card">
                            <div class="metric-title">
                                <span class="status-indicator ${status.dashboard_running ? 'status-healthy' : 'status-critical'}"></span>
                                System Status
                            </div>
                            <div class="metric-value">${status.status}</div>
                            <div class="metric-label">Version: ${status.version}</div>
                        </div>
                    </div>
                `;

                document.getElementById('dashboard-content').innerHTML = html;
            }

            renderError(message) {
                document.getElementById('dashboard-content').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${message}
                    </div>
                `;
            }

            getStatusClass(status) {
                switch (status.toLowerCase()) {
                    case 'healthy': return 'status-healthy';
                    case 'degraded': return 'status-warning';
                    case 'unhealthy': return 'status-critical';
                    default: return 'status-warning';
                }
            }

            formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            updateLastUpdatedTime() {
                const now = new Date();
                document.getElementById('last-updated').textContent = 
                    `Last updated: ${now.toLocaleTimeString()}`;
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new SongbirdDashboard();
        });
    </script>
</body>
</html>
