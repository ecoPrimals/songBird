[package]
name = "songbird-bluetooth"
version.workspace = true
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals Team"]
description = "EXPERIMENTAL: Pure Rust Bluetooth LE stack for Songbird - Genesis Phase 2"
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["bluetooth", "ble", "no-std", "embedded", "sovereignty"]
categories = ["network-programming", "embedded", "no-std"]

# EXPERIMENTAL STATUS: This crate is under active development for Phase 2
# Genesis physical channels (Bluetooth, FIDO2, QR) are not yet production-ready
# See DEEP_DEBT_EVOLUTION_PLAN.md for evolution roadmap

[dependencies]
# Pure Rust BLE stack (Embassy project)
trouble-host = { version = "0.5", default-features = false, features = ["gatt", "central", "peripheral"] }
bt-hci = "0.6"

# Transport layers - USB (dual support for migration)
nusb = { version = "0.2", optional = true }            # Pure Rust USB (default)
rusb = { version = "0.9", optional = true }            # C-based USB (fallback)
serialport = { version = "4.5", optional = true }      # UART transport

# Async runtime (Tokio for desktop, Embassy for embedded)
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }

# Error handling (modern, zero-cost)
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }

# Logging
tracing = "0.1"

# Utilities
uuid = { version = "1.6", features = ["v4"] }
bytes = "1.5"
futures = "0.3"

# Zero-copy optimizations
zerocopy = { version = "0.7", features = ["derive"] }
async-trait.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
criterion = "0.5"
proptest = "1.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait.workspace = true
rand.workspace = true

[features]
default = ["usb-rust"]

# Transport layers
usb-rust = ["nusb"]     # Pure Rust USB (default, ecoBin compliant)
usb-c = ["rusb"]        # C-based USB (fallback for compatibility)
usb = ["usb-rust"]      # Alias for convenience
uart = ["serialport"]

# Optional features
serde = ["dep:serde", "uuid/serde"]

# Development features
test-utils = []
serialport = ["dep:serialport"]

[lib]
# Deny unsafe code by default - we're building safe, fast Rust
# Any unsafe MUST be documented with SAFETY comments
doctest = true

# Benchmarks (to be added later)
# [[bench]]
# name = "bluetooth_benchmarks"
# harness = false
# required-features = ["tokio-runtime"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
# TEMPORARY: Allow warnings while in experimental phase (Phase 2)
# This crate will be evolved to full production quality during Genesis implementation
# See DEEP_DEBT_EVOLUTION_PLAN.md Section "Phase 2" for evolution roadmap
all = "allow"
# Still enforce critical safety lints
correctness = "deny"
suspicious = "deny"
