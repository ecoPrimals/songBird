[package]
name = "songbird-universal-primals"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Universal primal components and BearDog integration for Songbird"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["primals", "beardog", "universal", "integration", "gaming"]
categories = ["game-engines", "network-programming", "api-bindings"]

[dependencies]
async-trait = "0.1.68"
chrono = { version = "0.4.24", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.11", features = ["json"] }
url = "2.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
thiserror = "1.0"

# Internal dependencies
songbird-config = { path = "../songbird-config" }
songbird-errors = { path = "../songbird-errors" }
songbird-discovery = { path = "../songbird-discovery" }
songbird-universal = { path = "../songbird-universal" }

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "ecosystem_standalone_demo"
path = "../../examples/ecosystem_standalone_demo.rs" 