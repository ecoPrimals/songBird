[package]
name = "songbird-universal"
version = "0.1.0"
edition = "2021"
description = "Universal types and patterns for Songbird ecosystem integration"
authors = ["Songbird Team"]
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] } 
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
url = "2.0"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"

# Internal dependencies
songbird-config = { path = "../songbird-config" }
songbird-errors = { path = "../songbird-errors" }

[dev-dependencies]
tokio-test = "0.4" 