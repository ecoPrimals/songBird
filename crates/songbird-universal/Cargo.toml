[package]
name = "songbird-universal"
version.workspace = true
edition.workspace = true
description = "Universal types and patterns for Songbird ecosystem integration"
authors = ["Songbird Team"]
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
keywords = ["universal", "orchestration", "capabilities", "distributed", "framework"]
categories = ["network-programming", "development-tools", "web-programming"]


[lints]
workspace = true

[features]
default = []
federation-tests-disabled = []  # Feature flag for disabled federation tests

# Discovery backend features (optional)
mdns = ["dep:mdns"]
dns-sd = ["dep:hickory-resolver"]
k8s = ["dep:kube", "dep:k8s-openapi"]
docker = ["dep:bollard"]

# Convenience feature to enable all discovery backends
full-discovery = ["mdns", "dns-sd", "k8s", "docker"]

[dependencies]
async-trait = { workspace = true }
anyhow = { workspace = true } # Used by unix_rpc_client (Pure Rust RPC!)
chrono = { workspace = true }
futures = "0.3"
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = "2.0"
uuid = { workspace = true }
base64 = "0.22"

# tarpc dependencies for high-performance primal-to-primal RPC (v3.12.0)
tarpc = { workspace = true, features = ["full"] }
bincode = { workspace = true }
tokio-util = { version = "0.7.17", features = ["codec"] }
tokio-serde = { version = "0.8.0", features = ["bincode"] }

# Internal dependencies
songbird-process-env.workspace = true
songbird-config = { path = "../songbird-config" }
songbird-types = { path = "../songbird-types" }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!

# Optional: Discovery backend dependencies
mdns = { version = "3.0", optional = true }
hickory-resolver = { workspace = true, optional = true }
kube = { version = "0.95", optional = true, features = ["client", "runtime"] }
k8s-openapi = { version = "0.23", optional = true, features = ["v1_30"] }
bollard = { version = "0.17", optional = true }

[dev-dependencies]
songbird-config = { path = "../songbird-config" }
mockito = "1.2"
tokio-test = "0.4"
songbird-test-utils = { path = "../songbird-test-utils" }
wiremock = "0.6"
