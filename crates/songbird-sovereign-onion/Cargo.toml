[package]
name = "songbird-sovereign-onion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
readme = "README.md"
description = "Pure Rust minimal onion service protocol for sovereign device-to-device communication"
keywords = ["onion", "tor", "p2p", "pure-rust", "sovereignty"]
categories = ["network-programming", "distributed-systems"]  # Removed "cryptography" - delegates to security provider

[dependencies]
# Async runtime (Pure Rust)
tokio = { workspace = true, features = ["full"] }

# Cryptography (100% Pure Rust - RustCrypto)
# ⚠️ TRUE PRIMAL FIX (Feb 6, 2026): Crypto dependencies now OPTIONAL
# Production: Delegates to security provider (ZERO crypto in Songbird!)
# Testing: Uses standalone feature for offline development
ed25519-dalek = { version = "2.1", optional = true }        # Identity keys (testing only)
x25519-dalek = { version = "2.0", optional = true }         # Key exchange (testing only)
chacha20poly1305 = { version = "0.10", optional = true }    # AEAD encryption (testing only)
sha3 = { version = "0.10", optional = true }                # .onion derivation (testing only)
sha2 = { workspace = true, optional = true }                # HKDF (testing only)
hmac = { workspace = true, optional = true }                # HKDF (testing only)

# Encoding (Pure Rust)
base32 = "0.5"               # For .onion address encoding
base64 = { workspace = true }              # For JSON-RPC data encoding

# Utilities (Pure Rust)
rand = { workspace = true }                 # Random number generation
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

# Internal dependencies
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
songbird-config = { path = "../songbird-config" }
songbird-types = { path = "../songbird-types" }

[lints]
workspace = true
[dev-dependencies]
tokio-test = "0.4"


[features]
# Production builds: ZERO crypto (delegates to security provider)
# Test builds: Use --features standalone for offline testing
default = []  # Storage: IPC capability discovery at runtime; in-memory fallback
standalone = [
    "ed25519-dalek",
    "x25519-dalek",
    "chacha20poly1305",
    "sha3",
    "sha2",
    "hmac"
]  # Enable standalone crypto for testing/offline development only

[lib]
name = "songbird_sovereign_onion"
path = "src/lib.rs"

# Enforce Pure Rust
[[package.metadata.enforce]]
no_unsafe = true
no_c_dependencies = true
