[package]
name = "songbird-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
readme = "README.md"
description = "Pure Rust TLS 1.3 implementation with capability-based crypto delegation to the security provider"
keywords = ["tls", "security", "pure-rust", "capability-based"]
categories = ["network-programming", "development-tools::testing"]  # Removed "cryptography" - delegates to security provider

[dependencies]
# Core dependencies (all Pure Rust!)
songbird-process-env.workspace = true
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
songbird-types = { path = "../songbird-types" }
getrandom = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# Serialization (Pure Rust)
serde = { workspace = true }
serde_json = { workspace = true }

# Base64 encoding (Pure Rust)
base64 = "0.22"

# X.509 certificate parsing (Pure Rust)
x509-parser = "0.16"

# ⚠️ TRUE PRIMAL: Certificate generation for testing only (optional)
ed25519-dalek = { version = "2.1", optional = true }  # Ed25519 for self-signed certs (testing only)
rand = { workspace = true, optional = true }           # For key generation (testing only)
chrono = { workspace = true, optional = true }         # For certificate validity (testing only)

[lints]
workspace = true
[dev-dependencies]
tokio-test = "0.4"

ed25519-dalek = "2.1"
rand = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[features]
default = ["local-certs"]  # Include local-certs for backward compat
local-certs = ["ed25519-dalek", "rand", "chrono"]  # ⚠️ Self-signed cert generation (testing only) - production uses Tower Atomic certs!
# Future: Add features for different protocol support
# http2 = []
# http3 = []
# websocket = []

[lib]
name = "songbird_tls"
path = "src/lib.rs"
