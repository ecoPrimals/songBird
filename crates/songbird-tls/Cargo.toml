[package]
name = "songbird-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
readme = "README.md"
description = "Pure Rust TLS 1.3 implementation with capability-based crypto delegation to BearDog"
keywords = ["tls", "security", "pure-rust", "capability-based"]
categories = ["network-programming", "development-tools::testing"]  # Removed "cryptography" - delegates to BearDog!

[dependencies]
# Core dependencies (all Pure Rust!)
songbird-process-env.workspace = true
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
songbird-types = { path = "../songbird-types" }
getrandom = { workspace = true }
tokio = { version = "1", features = ["full", "net"] }
tracing = "0.1"
anyhow = "1.0"

# Serialization (Pure Rust)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 encoding (Pure Rust)
base64 = "0.22"

# Pin projection for async stream abstraction (Pure Rust)
pin-project = "1.1"

# X.509 certificate parsing (Pure Rust)
x509-parser = "0.16"

# ⚠️ TRUE PRIMAL: Certificate generation for testing only (optional)
ed25519-dalek = { version = "2.1", optional = true }  # Ed25519 for self-signed certs (testing only)
rand = { version = "0.8", optional = true }           # For key generation (testing only)
chrono = { version = "0.4", optional = true }         # For certificate validity (testing only)

[lints]
workspace = true
[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
rcgen = "0.13"
hmac = "0.12"
sha2 = "0.10"

[features]
default = ["local-certs"]  # Include local-certs for backward compat
local-certs = ["ed25519-dalek", "rand", "chrono"]  # ⚠️ Self-signed cert generation (testing only) - production uses Tower Atomic certs!
# Future: Add features for different protocol support
# http2 = []
# http3 = []
# websocket = []

[lib]
name = "songbird_tls"
path = "src/lib.rs"
