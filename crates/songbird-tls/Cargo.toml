[package]
name = "songbird-tls"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "README.md"
description = "Pure Rust TLS 1.3 implementation with capability-based crypto delegation to BearDog"
keywords = ["tls", "security", "pure-rust", "capability-based"]
categories = ["cryptography", "network-programming"]

[dependencies]
# Core dependencies (all Pure Rust!)
tokio = { version = "1", features = ["full", "net"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# Serialization (Pure Rust)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 encoding (Pure Rust)
base64 = "0.22"

# Pin projection for async stream abstraction (Pure Rust)
pin-project = "1.1"

# Pure Rust certificate generation (standalone mode)
ed25519-dalek = "2.1"  # 100% Pure Rust Ed25519 signatures
rand = "0.8"           # For key generation
chrono = "0.4"         # For certificate validity

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[features]
default = []
# Future: Add features for different protocol support
# http2 = []
# http3 = []
# websocket = []

[lib]
name = "songbird_tls"
path = "src/lib.rs"

