[package]
name = "songbird-test-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified test utilities and helpers for the Songbird ecosystem"
readme = "README.md"
keywords = ["testing", "utilities", "songbird", "helpers", "mocks"]
categories = ["development-tools::testing"]


[lints]
workspace = true

[features]
default = ["tracing"]
tracing = []

[dependencies]
songbird-process-env.workspace = true
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
fastrand = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }
songbird-canonical = { path = "../songbird-canonical" }
tracing-subscriber = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
songbird-orchestrator = { path = "../songbird-orchestrator" }
songbird-discovery = { path = "../songbird-discovery" } 
