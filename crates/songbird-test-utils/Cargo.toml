[package]
name = "songbird-test-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified test utilities and helpers for the Songbird ecosystem"
readme = "README.md"
keywords = ["testing", "utilities", "songbird", "helpers", "mocks"]
categories = ["development-tools::testing"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
tempfile = "3.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-test = "0.2"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
colored = "2.0"
songbird-errors = { path = "../songbird-errors" }
songbird-config = { path = "../songbird-config" }
# songbird-core = { path = "../songbird-core" }  # TEMPORARILY DISABLED: compilation issues
# songbird-network = { path = "../songbird-network" }  # TEMPORARILY DISABLED: 842 compilation errors
songbird-canonical = { path = "../songbird-canonical" }
tracing-subscriber = "0.3"
once_cell = "1.19"

[dev-dependencies]
criterion = "0.5" 