[package]
name = "songbird-compute-bridge"
version.workspace = true
edition.workspace = true
description = "Agnostic compute service bridge for Songbird federation - works with ANY compute provider"
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["compute", "distributed", "orchestration", "bridge", "agnostic"]
categories = ["network-programming", "web-programming"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = { workspace = true }
num_cpus = "1.16"
hostname = "0.4"

# Internal dependencies
songbird-config = { path = "../songbird-config" }
songbird-http-client = { path = "../songbird-http-client" }  # ✅ 100% Pure Rust!

[lints]
workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

