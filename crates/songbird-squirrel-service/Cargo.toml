[package]
name = "songbird-squirrel-service"
version = "0.1.0"
edition = "2021"
authors = ["ecoPrimals Team"]
description = "Squirrel: AI/MCP Service - The True Model Context Protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["ai", "mcp", "model-context-protocol", "llm", "distributed"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "squirrel"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# HTTP server
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client (for AI APIs)
reqwest = { version = "0.11", features = ["json"] }

# AI APIs
anthropic = "0.0.8"  # Claude
# openai = { version = "1.0", optional = true }

# MCP Protocol
# mcp-server = "0.1"  # TODO: Add when available

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Config
songbird-config = { path = "../songbird-config" }
songbird-types = { path = "../songbird-types" }

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["claude"]
claude = []

