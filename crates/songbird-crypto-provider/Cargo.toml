[package]
name = "songbird-crypto-provider"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Shared crypto provider for Songbird crates — Neural API + direct security-provider routing"
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
keywords = ["crypto", "neural-api", "security-provider", "ipc", "tower-atomic"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
tokio = { workspace = true, features = ["net", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
default = ["btsp-client"]
btsp-client = ["dep:hmac", "dep:sha2", "dep:getrandom", "dep:base64"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
