[package]
name = "songbird-crypto-provider"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Shared crypto provider for Songbird crates — Neural API + Direct BearDog routing"
license.workspace = true
repository = "https://github.com/ecoPrimals/SongBird"
keywords = ["crypto", "neural-api", "beardog", "ipc", "tower-atomic"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
tokio = { workspace = true, features = ["net", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
