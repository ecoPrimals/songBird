[package]
name = "songbird-errors"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "Error handling and validation for Songbird components"
repository = "https://github.com/ecoPrimals/SongBird"
readme = "../../README.md"
keywords = ["errors", "validation", "gaming", "networking", "rust"]
categories = ["data-structures", "network-programming", "game-engines"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
url = "2.5.4"
num_cpus = "1.16"
sys-info = "0.9.1"
