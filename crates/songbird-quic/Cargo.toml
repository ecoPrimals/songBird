[package]
name = "songbird-quic"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Pure Rust QUIC protocol for Songbird with BearDog crypto delegation"
readme = "../README.md"
keywords = ["quic", "protocol", "songbird", "beardog", "pure-rust"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# QUIC — default-features off removes platform-verifier/bloom/log we don't need.
# rustls-ring is still required: quinn gates quinn::crypto::rustls behind it.
# Upstream blocker: quinn has no rustls-rustcrypto feature (tracked in REMAINING_WORK.md).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Crypto - BearDog delegation only
# NO direct crypto - all via BearDog client

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = { workspace = true }
anyhow = "1"

# Logging
tracing = "0.1"

# Time
chrono = "0.4"

# Types
bytes = "1"

# TLS — Quinn 0.11 uses rustls 0.23. Production: rustls-rustcrypto (pure Rust).
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-pemfile = "2"

# Pure-Rust Ed25519 for self-signed inter-primal certs (replaces rcgen + ring)
ed25519-dalek = "2.1"
rand = { workspace = true }

# Songbird internal
songbird-process-env.workspace = true
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
songbird-types = { path = "../songbird-types" }

[lints]
workspace = true
[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
anyhow = "1.0"

[features]
# ring: reliable QUIC cipher suites with quinn/rustls 0.23 (rustls-rustcrypto alone may lack QUIC suites).
# Default is empty (ecoBin forbids ring in application code). Enable `ring-crypto` only for local/standalone testing.
default = []
# Opt-in for standalone testing with ring.
# rcgen removed — self-signed certs now use ed25519-dalek (pure Rust).
# quinn still pulls ring transitively via rustls-ring (upstream blocker: no rustls-rustcrypto feature in quinn).
# Production builds use BearDog/Tower Atomic for crypto via IPC.
ring-crypto = ["rustls/ring"]
