[package]
name = "songbird-quic"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Pure Rust QUIC protocol for Songbird with BearDog crypto delegation"
readme = "../README.md"
keywords = ["quic", "protocol", "songbird", "beardog", "pure-rust"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Crypto - BearDog delegation only via IPC (no ring, no rustls)
base64 = "0.22"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = { workspace = true }
anyhow = "1"

# Logging
tracing = "0.1"

# Time
chrono = "0.4"

# Types
bytes = "1"

# Pure-Rust Ed25519 for self-signed inter-primal certs
ed25519-dalek = "2.1"
rand = { workspace = true }

# Songbird internal
songbird-process-env.workspace = true
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
songbird-types = { path = "../songbird-types" }

[lints]
workspace = true
[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
anyhow = "1.0"

[features]
default = []
