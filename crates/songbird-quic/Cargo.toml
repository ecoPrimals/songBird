[package]
name = "songbird-quic"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Pure Rust QUIC protocol for Songbird with BearDog crypto delegation"
readme = "../README.md"
keywords = ["quic", "protocol", "songbird", "beardog", "pure-rust"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# QUIC implementation - pure Rust
quinn = "0.11"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Crypto - BearDog delegation only
# NO direct crypto - all via BearDog client

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"

# Time
chrono = "0.4"

# Types
bytes = "1"

# TLS/Certificate generation (temporary - will be replaced with BearDog provider)
# Quinn 0.11 uses rustls 0.23
rustls = { version = "0.23", features = ["ring", "std"] }
rcgen = "0.13"
rustls-pemfile = "2"

# Songbird internal
songbird-types = { path = "../songbird-types" }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
anyhow = "1.0"

[features]
default = []
