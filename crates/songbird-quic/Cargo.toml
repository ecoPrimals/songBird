[package]
name = "songbird-quic"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Pure Rust QUIC protocol for Songbird with security provider crypto delegation"
readme = "../README.md"
keywords = ["quic", "protocol", "songbird", "security-provider", "pure-rust"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Crypto - security provider delegation only via IPC (no ring, no rustls)
base64 = "0.22"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# Types
bytes = { workspace = true }

# Pure-Rust Ed25519 for self-signed inter-primal certs (local bootstrap only)
ed25519-dalek = { version = "2.1", optional = true }
rand = { workspace = true }

# Songbird internal
songbird-process-env.workspace = true
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
songbird-types = { path = "../songbird-types" }

[lints]
workspace = true
[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
local-certs = ["dep:ed25519-dalek"]
