[package]
name = "songbird-tor-protocol"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals <songbird@ecoprimal.io>"]
license.workspace = true
description = "Pure Rust Tor protocol implementation for Songbird — security-provider crypto delegation (TRUE PRIMAL)"
repository = "https://github.com/ecoPrimals/songBird"
keywords = ["tor", "onion", "privacy", "p2p", "pure-rust"]
categories = ["network-programming", "cryptography"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread"] }

# Parsing
nom = "7"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Encoding
base64 = "0.22"
base32 = "0.5"

# Bitflags
bitflags = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client for directory fetching (pure Rust, zero ring)
# Tor directory authorities serve plain HTTP - no TLS needed
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["client"] }
http-body-util = { workspace = true }
bytes = { workspace = true }

# TLS for relay connections (pure Rust, security provider crypto delegation)
# songbird-tls delegates all crypto to the security provider — ZERO ring, ZERO C
songbird-tls = { path = "../songbird-tls" }
songbird-types = { path = "../songbird-types" }

# Crypto delegation (NO direct crypto!)
# All crypto via security provider IPC / Neural API (`songbird-crypto-provider`)
songbird-crypto-provider = { path = "../songbird-crypto-provider" }

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { workspace = true }

[features]
default = []

[[example]]
name = "fetch_consensus"
path = "examples/fetch_consensus.rs"
