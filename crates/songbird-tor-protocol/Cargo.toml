[package]
name = "songbird-tor-protocol"
version.workspace = true
edition.workspace = true
authors = ["ecoPrimals <songbird@ecoprimal.io>"]
license.workspace = true
description = "Pure Rust Tor protocol implementation for Songbird - TRUE PRIMAL (100% BearDog delegation)"
repository = "https://github.com/ecoPrimals/songBird"
keywords = ["tor", "onion", "privacy", "p2p", "pure-rust"]
categories = ["network-programming", "cryptography"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread"] }

# Parsing
nom = "7"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"

# Encoding
base64 = "0.22"
base32 = "0.5"

# Bitflags
bitflags = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage (optional)
sled = { version = "0.34", optional = true }

# HTTP client for directory fetching (pure Rust, zero ring)
# Tor directory authorities serve plain HTTP - no TLS needed
hyper = { version = "1.0", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1.0"

# TLS for relay connections (pure Rust, BearDog crypto delegation)
# songbird-tls delegates all crypto to BearDog - ZERO ring, ZERO C
songbird-tls = { path = "../songbird-tls" }

# Crypto delegation (NO direct crypto!)
# All crypto via BearDog IPC / Neural API (`songbird-crypto-provider`)
songbird-crypto-provider = { path = "../songbird-crypto-provider" }
async-trait = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"

[features]
default = []
persistent-cache = ["sled"]

[[example]]
name = "fetch_consensus"
path = "examples/fetch_consensus.rs"
