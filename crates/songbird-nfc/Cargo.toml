[package]
name = "songbird-nfc"
version = "0.1.0"
edition = "2021"
authors = ["BiomeOS Team"]
description = "Dark Forest compliant NFC genesis protocol for Songbird"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Time utilities
chrono = "0.4"

# Random number generation
rand = "0.8"

# Async trait
async-trait = "0.1"

# Songbird internal
songbird-types = { path = "../songbird-types" }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"

[features]
default = []

# Platform-specific NFC backends
platform-android = []
platform-ios = []
platform-linux = []
