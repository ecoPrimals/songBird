[package]
name = "songbird-nfc"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Dark Forest compliant NFC genesis protocol for Songbird"
readme = "../README.md"
keywords = ["nfc", "genesis", "songbird", "proximity", "protocol"]
categories = ["network-programming", "cryptography"]

[lints]
workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Random number generation
rand = { workspace = true }

# Songbird internal
songbird-process-env.workspace = true
songbird-types = { path = "../songbird-types" }
songbird-crypto-provider = { path = "../songbird-crypto-provider" }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { workspace = true }

[features]
default = []
