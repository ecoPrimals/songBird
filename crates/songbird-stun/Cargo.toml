[package]
name = "songbird-stun"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/ecoPrimals/songbird"
readme = "README.md"
keywords = ["stun", "nat", "p2p", "pure-rust", "rfc5389"]
categories = ["network-programming"]
description = "Pure Rust STUN (RFC 5389) client for NAT traversal - zero C dependencies"
authors = ["ecoPrimals Team"]

[dependencies]
tokio = { workspace = true, features = ["net", "time", "sync"] }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
futures = "0.3"

# Internal dependencies
songbird-types = { path = "../songbird-types" }
songbird-config = { path = "../songbird-config" }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-test = "0.4"

[lib]
path = "src/lib.rs"

