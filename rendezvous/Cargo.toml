[package]
name = "songbird-rendezvous"
version = "0.1.0"
edition = "2021"
authors = ["Songbird Team"]
description = "Privacy-first rendezvous server for Songbird federation across the internet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoprimals/songbird"
keywords = ["p2p", "federation", "privacy", "rendezvous", "discovery"]
categories = ["network-programming", "web-programming", "cryptography"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID and time
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography (for signature verification)
ed25519-dalek = { version = "2.1", features = ["serde"] }
sha2 = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Network
tokio-tungstenite = "0.21"
futures-util = "0.3"

[dev-dependencies]
# REMOVED: reqwest (C dependency via native-tls/OpenSSL, unused in tests)
# If HTTP client needed for tests in future, use songbird-http-client (Pure Rust!)
