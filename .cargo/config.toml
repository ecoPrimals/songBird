[build]
rustflags = [
    "-W", "warnings",                    # Warn on warnings (not deny)
    "-W", "clippy::all",                # Warn on clippy lints
    "-A", "missing_docs",               # Allow missing docs temporarily
    "-A", "missing_debug_implementations", # Allow missing Debug temporarily
    "-A", "unused_results",             # Allow unused results temporarily
]

