# Songbird Cross-Compilation Configuration
# TRUE ecoBin v2.0 → genomeBin Evolution
# Based on biomeOS + BearDog reference implementations
# Created: January 30, 2026

[build]
# Use all available cores for parallel compilation
jobs = 24
pipelining = true

# Default to x86_64 musl for maximum portability
target = "x86_64-unknown-linux-musl"

# ============================================================================
# CROSS-COMPILATION TARGETS (genomeBin Support)
# ============================================================================

# ARM64 Linux (musl for static linking)
[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static",
    "-C", "link-arg=-lc"
]

# ARM64 Android (for Pixel 8a / GrapheneOS)
[target.aarch64-linux-android]
linker = "aarch64-linux-android-ld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static"
]

# x86_64 Linux (musl for static linking - ecoBin v2.0 standard)
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static"
]

# ARM64 macOS (Apple Silicon)
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-dead_strip"
]

# RISC-V (future expansion)
[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"

# Windows cross-compilation (Pure Rust)
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# ============================================================================
# BUILD PROFILES (genomeBin Optimization)
# ============================================================================

[profile.dev]
incremental = true
split-debuginfo = "unpacked"

[test]
# Skip failing comprehensive tests temporarily to get baseline coverage
