[build]
rustflags = []

# Platform-agnostic cross-compilation targets (genomeBin compliance)
# Following TRUE ecoBin #4: ZERO hardcoding, capability-based discovery

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
# Uses $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/
# Fallback: Ensure NDK is in PATH or set AR/CC env vars

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"

[target.i686-linux-android]
linker = "i686-linux-android21-clang"

# Windows cross-compilation (Pure Rust, no mingw-w64 dependencies needed!)
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# musl (static linking for USB/portable) - already works via rustc defaults!
# [target.x86_64-unknown-linux-musl]
# No special config needed - Pure Rust + static linking = perfect!

[test]
# Skip failing comprehensive tests temporarily to get baseline coverage
