name: 🔍 Vendor Hardcoding Prevention

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  vendor-hardcoding-check:
    name: 🚨 Check for Vendor Hardcoding
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: clippy
        
    - name: 📦 Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: 🔧 Build vendor pattern migrator
      run: |
        cd tools/vendor_pattern_migrator
        cargo build --release
        
    - name: 🔍 Scan for vendor hardcoding patterns
      run: |
        cd tools/vendor_pattern_migrator
        cargo run --release -- --dry-run --path . --report vendor-patterns.json
        
    - name: 📊 Check pattern count
      run: |
        cd tools/vendor_pattern_migrator
        PATTERN_COUNT=$(cargo run --release -- --dry-run --path . | grep "🎯 Patterns found:" | awk '{print $4}')
        echo "Found $PATTERN_COUNT hardcoded patterns"
        
        # Set baseline - current known patterns that we're migrating
        BASELINE_COUNT=521
        
        if [ "$PATTERN_COUNT" -gt "$BASELINE_COUNT" ]; then
          echo "❌ ERROR: New vendor hardcoding detected!"
          echo "   Current patterns: $PATTERN_COUNT"
          echo "   Baseline: $BASELINE_COUNT"
          echo "   New patterns: $((PATTERN_COUNT - BASELINE_COUNT))"
          echo ""
          echo "🚨 VENDOR HARDCODING POLICY VIOLATION"
          echo "   New hardcoded vendor patterns are not allowed."
          echo "   Please use capability-based discovery instead."
          echo ""
          echo "📋 MIGRATION GUIDE:"
          echo "   • Replace vendor names with capability names"
          echo "   • Use AgnosticServiceDiscovery for external services"
          echo "   • Use InfantDiscoveryManager for primal discovery"
          echo "   • See: DEPRECATION_AND_MODERNIZATION_STRATEGY.md"
          exit 1
        elif [ "$PATTERN_COUNT" -lt "$BASELINE_COUNT" ]; then
          echo "✅ GREAT: Vendor hardcoding reduced!"
          echo "   Previous patterns: $BASELINE_COUNT"
          echo "   Current patterns: $PATTERN_COUNT"
          echo "   Patterns eliminated: $((BASELINE_COUNT - PATTERN_COUNT))"
          echo ""
          echo "🎉 Consider updating the baseline in this workflow to $PATTERN_COUNT"
        else
          echo "✅ No new vendor hardcoding detected"
          echo "   Pattern count stable at: $PATTERN_COUNT"
        fi
        
    - name: 📄 Upload pattern report
      uses: actions/upload-artifact@v3
      with:
        name: vendor-patterns-report
        path: tools/vendor_pattern_migrator/vendor-patterns.json
        retention-days: 30
        
    - name: 📝 Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          try {
            // Read the pattern report
            const reportPath = 'tools/vendor_pattern_migrator/vendor-patterns.json';
            if (!fs.existsSync(reportPath)) {
              console.log('No pattern report found');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const totalPatterns = report.total_patterns;
            const baseline = 521;
            
            let comment = '## 🔍 Vendor Hardcoding Check Results\n\n';
            
            if (totalPatterns > baseline) {
              comment += '❌ **New vendor hardcoding detected!**\n\n';
              comment += `- **Current patterns**: ${totalPatterns}\n`;
              comment += `- **Baseline**: ${baseline}\n`;
              comment += `- **New patterns**: ${totalPatterns - baseline}\n\n`;
              comment += '### 🚨 Action Required\n';
              comment += 'Please replace hardcoded vendor patterns with capability-based alternatives:\n\n';
              comment += '- Use `AgnosticServiceDiscovery` for external services\n';
              comment += '- Use `InfantDiscoveryManager` for primal discovery\n';
              comment += '- Replace vendor names with capability names\n\n';
              comment += 'See [Migration Guide](DEPRECATION_AND_MODERNIZATION_STRATEGY.md) for details.\n';
            } else if (totalPatterns < baseline) {
              comment += '✅ **Excellent! Vendor hardcoding reduced!**\n\n';
              comment += `- **Previous patterns**: ${baseline}\n`;
              comment += `- **Current patterns**: ${totalPatterns}\n`;
              comment += `- **Patterns eliminated**: ${baseline - totalPatterns}\n\n`;
              comment += '🎉 Great work on the vendor hardcoding elimination!\n';
            } else {
              comment += '✅ **No new vendor hardcoding detected**\n\n';
              comment += `Pattern count stable at: ${totalPatterns}\n`;
            }
            
            // Add pattern breakdown
            if (report.category_summary) {
              comment += '\n### 📊 Pattern Breakdown\n\n';
              for (const [category, count] of Object.entries(report.category_summary)) {
                comment += `- **${category}**: ${count} patterns\n`;
              }
            }
            
            // Post the comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
          } catch (error) {
            console.log('Error posting comment:', error);
          }

  capability-architecture-check:
    name: 🏗️ Validate Capability Architecture
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: 🔍 Check for capability-based patterns
      run: |
        echo "🔍 Checking for proper capability-based architecture..."
        
        # Check for AgnosticServiceDiscovery usage
        AGNOSTIC_COUNT=$(grep -r "AgnosticServiceDiscovery" --include="*.rs" crates/ | wc -l)
        echo "✅ AgnosticServiceDiscovery references: $AGNOSTIC_COUNT"
        
        # Check for capability-based discovery
        CAPABILITY_COUNT=$(grep -r "discover_capability" --include="*.rs" crates/ | wc -l)
        echo "✅ Capability discovery calls: $CAPABILITY_COUNT"
        
        # Check for infant discovery usage
        INFANT_COUNT=$(grep -r "InfantDiscoveryManager" --include="*.rs" crates/ | wc -l)
        echo "✅ Infant discovery references: $INFANT_COUNT"
        
        # Ensure we have the core capability infrastructure
        if [ ! -f "crates/songbird-universal/src/agnostic_service_discovery.rs" ]; then
          echo "❌ ERROR: Missing agnostic service discovery implementation"
          exit 1
        fi
        
        if [ ! -f "crates/songbird-universal/src/infant_discovery.rs" ]; then
          echo "❌ ERROR: Missing infant discovery implementation"
          exit 1
        fi
        
        echo "✅ Capability architecture validation passed!"

  deprecation-check:
    name: 📋 Check Deprecation Compliance
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Validate deprecation markings
      run: |
        echo "🔍 Checking deprecation compliance..."
        
        # Check that deprecated constants have proper markings
        DEPRECATED_COUNT=$(grep -r "#\[deprecated" --include="*.rs" crates/ | wc -l)
        echo "✅ Deprecated items marked: $DEPRECATED_COUNT"
        
        # Check for migration instructions in deprecation messages
        MIGRATION_INSTRUCTIONS=$(grep -r "Use.*instead" --include="*.rs" crates/ | wc -l)
        echo "✅ Migration instructions provided: $MIGRATION_INSTRUCTIONS"
        
        # Ensure no unmarked hardcoded endpoints
        HARDCODED_ENDPOINTS=$(grep -r "DEFAULT.*endpoint" --include="*.rs" crates/songbird-config/src/config/constants.rs | grep -v deprecated | wc -l)
        
        if [ "$HARDCODED_ENDPOINTS" -gt 0 ]; then
          echo "❌ ERROR: Found unmarked hardcoded endpoints"
          echo "All hardcoded endpoints should be marked as deprecated"
          grep -r "DEFAULT.*endpoint" --include="*.rs" crates/songbird-config/src/config/constants.rs | grep -v deprecated
          exit 1
        fi
        
        echo "✅ Deprecation compliance check passed!" 