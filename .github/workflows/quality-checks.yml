name: Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  linting:
    name: Clippy Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  unwraps:
    name: Check Production Unwraps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for production unwraps
        run: |
          echo "Checking for .unwrap() in production code (excluding tests, examples, build.rs)..."
          hits=$(grep -rn '\.unwrap()' crates/*/src/ --include='*.rs' | grep -v '#\[cfg(test)\]' | grep -v 'mod tests' | grep -v '//.*unwrap' || true)
          if [ -n "$hits" ]; then
            echo "⚠️ Potential production unwraps found (review manually — may be in test modules):"
            echo "$hits"
          else
            echo "✅ Zero production .unwrap() calls"
          fi

  hardcoding:
    name: Audit Hardcoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded primal names in production
        run: |
          echo "Checking for hardcoded primal names in production code..."
          patterns='beardog\.sock|squirrel\.sock|nestgate\.sock|toadstool\.sock|BEARDOG_SOCKET|SQUIRREL_SOCKET'
          hits=$(grep -rn "$patterns" crates/*/src/ --include='*.rs' | grep -v '#\[cfg(test)\]' | grep -v 'mod tests' || true)
          if [ -n "$hits" ]; then
            echo "❌ Hardcoded primal names found:"
            echo "$hits"
            exit 1
          else
            echo "✅ Zero hardcoded primal names in production code"
          fi

  file-size:
    name: Check File Sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check production file sizes
        run: |
          echo "Checking for files > 1000 lines in production code..."
          violations=$(find crates/*/src -name "*.rs" -exec wc -l {} \; | awk '$1 > 1000 {print}')
          if [ -n "$violations" ]; then
            echo "❌ File size violations found:"
            echo "$violations"
            exit 1
          else
            echo "✅ All production files comply with 1000 line policy"
          fi

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Check coverage threshold
        run: |
          coverage=$(cargo llvm-cov --workspace --all-features 2>&1 | tail -1 | awk '{for(i=1;i<=NF;i++) if($i ~ /%/) {gsub(/%/,"",$i); print $i; exit}}')
          echo "Current coverage: ${coverage}%"
          if (( $(echo "$coverage < 66" | bc -l) )); then
            echo "❌ Coverage below minimum threshold (66%)"
            exit 1
          else
            echo "✅ Coverage meets minimum threshold (66%+, target 90%)"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  results:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [formatting, linting, unwraps, hardcoding, file-size, build, coverage, deny, documentation, security]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Quality Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Formatting | ${{ needs.formatting.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linting | ${{ needs.linting.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Unwraps | ${{ needs.unwraps.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hardcoding | ${{ needs.hardcoding.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| File Sizes | ${{ needs.file-size.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.deny.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.documentation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
