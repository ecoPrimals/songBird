# Songbird Orchestrator Configuration with Security Provider Integration
# =====================================================================
# 
# This configuration file demonstrates how to set up Songbird Orchestrator
# with a security provider (capability: security/crypto) for production deployments.
#
# The security provider (discovered at runtime via capability-based discovery) provides:
# - Enterprise-grade encryption and key management
# - Comprehensive access control and authorization
# - Audit logging and compliance reporting
# - Secure federation communication channels

[network]
bind_address = "0.0.0.0"
# Use SONGBIRD_PORT env var in production (defaults to orchestrator_port())
port = 8080  # Example default
# Use SONGBIRD_DISCOVERY_PORT env var (defaults to discovery_port())
discovery_port = 8081  # Example default
# Use SONGBIRD_FEDERATION_PORT env var (defaults to federation_port())
federation_port = 8082  # Example default
max_connections = 1000
connection_timeout_secs = 30
keep_alive_interval_secs = 60

[environment]
environment = "production"
log_level = "INFO"
enable_metrics = true
# Use SONGBIRD_METRICS_PORT env var (defaults to metrics_port())
metrics_port = 9090  # Example default
# Use SONGBIRD_HEALTH_PORT env var (defaults to metrics_port())
health_check_port = 8083  # Example default

[paths]
data_dir = "/var/lib/songbird"
config_dir = "/etc/songbird"
log_dir = "/var/log/songbird"
cache_dir = "/var/cache/songbird"
temp_dir = "/tmp/songbird"

# ============================================================================
# SECURITY PROVIDER INTEGRATION CONFIGURATION
# ============================================================================

[security_provider]
enabled = true

# Security Provider Endpoint Configuration
# Recommended: Use SECURITY_PROVIDER_SOCKET for auto-discovery in production
[security_provider.endpoint]
# Use SONGBIRD_SECURITY_PROVIDER_PORT env var (defaults to security_provider_port())
primary_url = "https://security.internal.company.com:8443"  # Example default
fallback_urls = [
    "https://beardog-backup.internal.company.com:8443",  # Example default
    "https://beardog-dr.internal.company.com:8443"  # Example default
]
connection_timeout_secs = 30
request_timeout_secs = 60
verify_tls = true
ca_cert_path = "/etc/ssl/certs/company-ca.pem"

# BearDog Authentication Configuration
[beardog.authentication]
auth_method = "mutual_tls"  # Options: api_key, mutual_tls, service_account, oauth2

# For mTLS authentication (recommended for production)
client_cert_path = "/etc/songbird/certs/songbird-client.pem"
client_key_path = "/etc/songbird/certs/songbird-client-key.pem"

# Alternative: API Key authentication (for development/testing)
# api_key = "your-beardog-api-key-here"

# Alternative: Service Account authentication
# [beardog.authentication.service_account]
# account_id = "songbird-orchestrator@company.com"
# key_file_path = "/etc/songbird/beardog-service-account.json"
# scopes = ["encryption", "key_management", "audit"]

# BearDog Security Configuration
[beardog.security]
default_security_level = "confidential"  # Options: public, internal, confidential, secret, top_secret
auto_key_rotation = true
key_rotation_interval_days = 30
compliance_mode = "soc2"  # Options: standard, fips140, soc2, gdpr
secure_federation_channels = true

# Encryption Algorithm Preferences
[beardog.security.encryption_preferences]
symmetric_algorithm = "aes-256-gcm"        # Options: aes-256-gcm, chacha20-poly1305
asymmetric_algorithm = "ed25519"           # Options: rsa-4096, ed25519
kdf = "argon2"                            # Options: pbkdf2, scrypt, argon2
hash_algorithm = "sha3-256"               # Options: sha256, sha3-256, blake3

# BearDog Key Management Configuration
[beardog.key_management]
storage_backend = "hsm"  # Options: hsm, kms, vault, file
usage_tracking = true

# Key Backup Configuration
[beardog.key_management.backup]
enabled = true
storage_location = "/secure/beardog/backups"
backup_encryption_key = "/etc/songbird/beardog-backup.key"
schedule = "0 2 * * *"  # Daily at 2 AM (cron format)
retention_days = 90

# Key Lifecycle Configuration
[beardog.key_management.lifecycle]
expiration_days = 365
expiration_warning_days = 30
auto_renewal = true
grace_period_days = 7

# BearDog Audit Configuration
[beardog.audit]
audit_level = "comprehensive"  # Options: minimal, standard, comprehensive, paranoid
log_retention_days = 365
real_time_alerts = true

# Audit Log Export Configuration
[beardog.audit.export]
enabled = true
format = "json"  # Options: json, csv, syslog, splunk
destination = "syslog://audit.internal.company.com:514"
schedule = "0 * * * *"  # Hourly (cron format)

# Compliance Reporting Configuration
[beardog.audit.compliance_reporting]
enabled = true
schedule = "0 0 1 * *"  # Monthly on the 1st (cron format)
recipients = [
    "security@company.com",
    "compliance@company.com",
    "ciso@company.com"
]
format = "pdf"  # Options: pdf, html, json
include_audit_logs = false

# BearDog Performance Configuration
[beardog.performance]
connection_pool_size = 10
max_concurrent_operations = 100
operation_timeout_secs = 30

# Retry Configuration
[beardog.performance.retry]
max_attempts = 3
initial_delay_ms = 1000
max_delay_ms = 10000
backoff_multiplier = 2.0

# Caching Configuration
[beardog.performance.caching]
enable_key_caching = true
key_cache_ttl_secs = 300  # 5 minutes
enable_access_control_caching = true
access_control_cache_ttl_secs = 60  # 1 minute
max_cache_size = 1000

# ============================================================================
# CUSTOM CONFIGURATION FOR YOUR ENVIRONMENT
# ============================================================================

[custom]
# Add any custom configuration specific to your deployment
company_name = "Your Company Name"
deployment_region = "us-east-1"
environment_tier = "production"

# Custom BearDog integration settings
[custom.beardog_integration]
enable_snapshot_encryption = true
enable_federation_security = true
enable_compliance_mode = true
custom_security_policies = [
    "require_mfa_for_admin_operations",
    "enforce_data_residency_requirements",
    "enable_zero_trust_networking"
]

# Integration with other security tools
[custom.security_integrations]
siem_endpoint = "https://siem.internal.company.com/api/v1/events"
vulnerability_scanner = "https://vuln-scanner.internal.company.com"
threat_intelligence = "https://threat-intel.internal.company.com" 