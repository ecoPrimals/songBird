# Custom Primal Integration Example
# This shows how any custom or forked Primal can work with Songbird's universal adapter

metadata:
  name: "example-biome-with-custom-primals"
  version: "1.0.0"
  description: "Example biome using custom and standard Primals"

services:
  web-service:
    endpoint: "http://localhost:8080"
    depends_on: []
    health_check:
      endpoint: "/health"
      interval_secs: 30
      timeout_secs: 5

networking:
  discovery:
    method: "mdns"
    config:
      bind_address: "0.0.0.0"
  ports: [8080, 8081]

# Universal Primal coordination - works with ANY Primal implementation
primals:
  # Standard Primals
  toadstool:
    enabled: true
    endpoint: "http://localhost:8082"
    capabilities: ["compute", "execution"]
  
  nestgate:
    enabled: true
    endpoint: "http://localhost:8081"
    capabilities: ["storage", "data"]
  
  beardog:
    enabled: true
    endpoint: "http://localhost:8083"
    capabilities: ["security", "authentication"]
  
  squirrel:
    enabled: true
    endpoint: "http://localhost:8084"
    capabilities: ["ai", "ml", "agents"]
  
  # Custom/Forked Primals - work seamlessly with universal adapter
  my-custom-primal:
    enabled: true
    endpoint: "http://localhost:9000"
    capabilities: ["custom", "blockchain", "distributed-ledger"]
  
  forked-toadstool:
    enabled: true
    endpoint: "http://localhost:9001"
    capabilities: ["compute", "execution", "gpu-acceleration"]
  
  community-storage:
    enabled: true
    endpoint: "http://localhost:9002"
    capabilities: ["storage", "ipfs", "decentralized"]
  
  specialized-ai:
    enabled: true
    endpoint: "http://localhost:9003"
    capabilities: ["ai", "computer-vision", "real-time-inference"]
  
  edge-compute:
    enabled: false  # Can be disabled without breaking the system
    endpoint: "http://edge-device:8090"
    capabilities: ["compute", "edge", "low-latency"]

# The universal adapter automatically:
# 1. Detects API endpoints based on capabilities
# 2. Sends standardized coordination payloads
# 3. Works with any Primal that implements the universal/v1 API
# 4. Falls back gracefully if any Primal is unavailable
# 5. Maintains backward compatibility with existing Primals 