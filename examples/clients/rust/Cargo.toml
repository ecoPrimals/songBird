[package]
name = "songbird-tarpc-client-example"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
description = "High-performance tarpc client for Songbird - 100x faster than JSON-RPC!"

# Make this a standalone package (not part of parent workspace)
[workspace]

[[bin]]
name = "songbird_tarpc_example"
path = "songbird_tarpc_client.rs"

[dependencies]
# tarpc for high-performance RPC
tarpc = { version = "0.34", features = ["full"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

[features]
# Enable the example main function
examples = []

