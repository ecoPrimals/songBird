# Songbird Universal Configuration Example
# This shows how Songbird can be configured for different ecosystems

apiVersion: "songbird.io/v1"
kind: "UniversalConfiguration"
metadata:
  name: "my-service-mesh"
  version: "1.0.0"
  description: "Universal service mesh configuration"

# Global service mesh configuration
service_mesh:
  name: "my-ecosystem"
  discovery:
    methods: ["dns", "consul", "kubernetes", "static"]
    interval: "30s"
    timeout: "5s"
  
  load_balancing:
    algorithm: "round_robin"
    health_check_interval: "10s"
    failure_threshold: 3
  
  security:
    providers: ["oauth2", "jwt", "custom"]
    encryption_required: true
    tls_enabled: true
  
  networking:
    protocols: ["http", "grpc", "websocket"]
    default_port_range: "8000-9000"
    bind_address: "0.0.0.0"

# Service definitions - replace hardcoded primals
services:
  # Security service (replaces BearDog)
  - name: "security-service"
    type:
      name: "security"
      category: "Security"
    endpoints:
      - url: "https://security.my-company.com"
        protocol: "https"
        health_check_path: "/health"
        metrics_path: "/metrics"
    capabilities:
      - "authentication"
      - "encryption"
      - "audit_logging"
      - "compliance_reporting"
    health_check:
      enabled: true
      interval: "30s"
      timeout: "5s"
    metadata:
      team: "security"
      sla: "99.9%"
  
  # Storage service (replaces NestGate)
  - name: "storage-service"
    type:
      name: "storage"
      category: "Storage"
    endpoints:
      - url: "https://storage.my-company.com"
        protocol: "https"
        health_check_path: "/health"
    capabilities:
      - "object_storage"
      - "backup"
      - "replication"
      - "volume_management"
    health_check:
      enabled: true
      interval: "30s"
    metadata:
      team: "infrastructure"
      data_classification: "sensitive"
  
  # Computing service (replaces ToadStool)
  - name: "compute-service"
    type:
      name: "compute"
      category: "Computing"
    endpoints:
      - url: "https://compute.my-company.com"
        protocol: "https"
      - url: "grpc://compute.my-company.com:9090"
        protocol: "grpc"
    capabilities:
      - "job_scheduling"
      - "auto_scaling"
      - "resource_allocation"
    health_check:
      enabled: true
      interval: "15s"
    metadata:
      team: "platform"
      resource_intensive: true
  
  # Monitoring service (custom)
  - name: "monitoring-service"
    type:
      name: "monitoring"
      category: "Monitoring"
    endpoints:
      - url: "https://monitoring.my-company.com"
        protocol: "https"
    capabilities:
      - "metrics_collection"
      - "alerting"
      - "dashboard"
    health_check:
      enabled: true
      interval: "30s"
    metadata:
      team: "sre"
      critical: true

# Plugin configuration for extensibility
plugins:
  - name: "ldap-auth-plugin"
    type: "authentication"
    enabled: true
    config:
      provider: "ldap"
      url: "ldap://ldap.my-company.com"
      base_dn: "dc=my-company,dc=com"
      user_filter: "(uid={username})"
  
  - name: "prometheus-metrics-plugin"
    type: "monitoring"
    enabled: true
    config:
      endpoint: "https://prometheus.my-company.com"
      scrape_interval: "15s"
      labels:
        environment: "production"
        mesh: "my-ecosystem"
  
  - name: "custom-logging-plugin"
    type: "logging"
    enabled: true
    config:
      format: "json"
      level: "info"
      outputs: ["stdout", "elasticsearch"]
      elasticsearch_url: "https://elasticsearch.my-company.com"

# Service mesh policies
policies:
  - name: "default-security-policy"
    type: "security"
    rules:
      - match:
          service_types: ["*"]
        require:
          - "authentication"
          - "encryption"
  
  - name: "high-availability-policy"
    type: "availability"
    rules:
      - match:
          capabilities: ["critical"]
        require:
          min_replicas: 3
          max_failure_rate: "1%"
  
  - name: "data-governance-policy"
    type: "governance"
    rules:
      - match:
          metadata:
            data_classification: "sensitive"
        require:
          - "audit_logging"
          - "encryption"
          - "compliance_reporting"

# Dynamic discovery configuration
discovery:
  # Kubernetes service discovery
  - name: "kubernetes"
    type: "kubernetes"
    enabled: true
    config:
      kubeconfig_path: "/etc/kubernetes/kubeconfig"
      namespace: "default"
      label_selector: "app=songbird-service"
  
  # Consul service discovery
  - name: "consul"
    type: "consul"
    enabled: true
    config:
      address: "consul.my-company.com:8500"
      datacenter: "dc1"
      token: "${CONSUL_TOKEN}"
  
  # Static service discovery
  - name: "static"
    type: "static"
    enabled: true
    config:
      services:
        - name: "legacy-service"
          endpoints: ["http://legacy.my-company.com:8080"]
          capabilities: ["legacy_api"]

# Branding configuration (optional)
branding:
  product_name: "MyCompany Service Mesh"
  organization: "My Company Inc."
  website: "https://my-company.com"
  support_email: "support@my-company.com"
  documentation_url: "https://docs.my-company.com/service-mesh"
  custom_messages:
    welcome: "Welcome to MyCompany Service Mesh!"
    help_footer: "For support, contact support@my-company.com"

# Environment-specific overrides
environments:
  development:
    service_mesh:
      security:
        encryption_required: false
        tls_enabled: false
    services:
      - name: "mock-security-service"
        type:
          name: "security"
          category: "Security"
        endpoints:
          - url: "http://localhost:8080"
            protocol: "http"
        capabilities: ["authentication"]
  
  staging:
    service_mesh:
      load_balancing:
        algorithm: "least_connections"
    plugins:
      - name: "prometheus-metrics-plugin"
        config:
          labels:
            environment: "staging"
  
  production:
    service_mesh:
      security:
        encryption_required: true
        tls_enabled: true
    policies:
      - name: "production-security-policy"
        type: "security"
        rules:
          - match:
              service_types: ["*"]
            require:
              - "authentication"
              - "encryption"
              - "audit_logging" 