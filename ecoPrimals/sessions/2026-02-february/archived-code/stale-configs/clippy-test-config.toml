# Clippy configuration for test files
# Test code has different requirements than production code

# Allow pedantic warnings in tests
allow-expect-in-tests = true
allow-unwrap-in-tests = true
too-many-lines-threshold = 2000

# Test-specific allows
[lints.clippy]
uninlined_format_args = "allow"  # format!("{:?}", x) is fine in tests
float_cmp = "allow"  # Direct float comparison acceptable in tests
useless_vec = "allow"  # vec! vs array doesn't matter in tests
unreadable_literal = "allow"  # Test values don't need separators

