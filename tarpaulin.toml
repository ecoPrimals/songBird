[tool.tarpaulin]
# Tarpaulin configuration for Songbird Universal Orchestrator test coverage

# Coverage target percentage
target-dir = "target/tarpaulin"

# Output formats
out = ["Html", "Json", "Xml"]

# Output directory
output-dir = "coverage-report"

# Include all packages in the workspace
all-features = true
workspace = true

# Coverage threshold (90% target)
fail-under = 90.0

# Timeout settings
timeout = 300

# Include patterns
include-tests = true
count = true
branch = true

# Exclude patterns
exclude = [
    # Exclude archived code
    "archive/*",
    # Exclude build artifacts
    "target/*",
    # Exclude example code
    "examples/*",
    # Exclude benchmark code
    "benches/*",
]

# Per-file exclusions (only list files that exist and have known issues)
exclude-files = []

# Engine settings
engine = "llvm"

# Verbose output
verbose = true

# Generate HTML report
[tool.tarpaulin.html]
title = "Songbird Universal Orchestrator - Test Coverage Report"

# JSON output settings
[tool.tarpaulin.json]
pretty = true 