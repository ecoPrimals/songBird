# Ultra-pedantic cargo-deny configuration for maximum security and hygiene

[bans]
# Deny multiple versions of the same crate
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Insecure or problematic crates
    { name = "openssl", version = "*" },          # Prefer rustls
    { name = "native-tls", version = "*" },       # Prefer rustls
    { name = "reqwest", version = "<0.11" },      # Old versions have vulnerabilities
    { name = "hyper", version = "<0.14" },        # Old versions have vulnerabilities
    { name = "tokio", version = "<1.20" },        # Require recent tokio for security
    { name = "serde_json", version = "<1.0.85" }, # Require recent for security
]

[licenses]
# Only allow permissive licenses
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0", 
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]
deny = [
    "GPL-2.0",
    "GPL-3.0", 
    "LGPL-2.1",
    "LGPL-3.0",
    "AGPL-3.0",
    "CC-BY-SA-4.0",
]
copyleft = "deny"
allow-osi-fsf-free = "neither"
default = "deny"

[advisories]
# Security advisory checking
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

[sources]
# Only allow crates.io and git sources
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [] 