# Ultra-pedantic cargo-deny configuration for maximum security and hygiene

[bans]
# Multiple versions are common in large trees; warn instead of failing CI.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Insecure or problematic crates
    { name = "openssl", version = "*" },          # Prefer rustls
    { name = "native-tls", version = "*" },       # Prefer rustls
    { name = "reqwest", version = "<0.11" },      # Old versions have vulnerabilities
    { name = "hyper", version = "<0.14" },        # Old versions have vulnerabilities
    { name = "tokio", version = "<1.20" },        # Require recent tokio for security
    { name = "serde_json", version = "<1.0.85" }, # Require recent for security
]

[licenses]
# Anything not listed is denied (cargo-deny 0.19+). GPL/LGPL/CC-BY-SA-4.0 are rejected
# by omission. Workspace uses AGPL-3.0-only; allow it so our own crates pass.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "AGPL-3.0-only",
]

[advisories]
# Advisory DB location/URLs are managed by cargo-deny. Vulnerabilities fail unless ignored.
ignore = []

[sources]
# Only allow crates.io and git sources
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
