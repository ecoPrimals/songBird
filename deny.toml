# Ultra-pedantic cargo-deny configuration for maximum security and hygiene
#
# Bluetooth `*-sys` / platform bindings: any such crates (e.g. from optional
# `legacy-bluetooth` / btleplug in songbird-genesis) are only pulled when those
# optional features are enabled — default builds use pure-Rust paths (e.g.
# `pure-bluetooth` / songbird-bluetooth).

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { name = "openssl", version = "*" },
    { name = "native-tls", version = "*" },
    { name = "reqwest", version = "<0.11" },
    { name = "hyper", version = "<0.14" },
    { name = "tokio", version = "<1.20" },
    { name = "serde_json", version = "<1.0.85" },
    # ecoBin: `ring` pulls C/ASM via `cc`. quinn/rustls/ring fully eliminated from songbird-quic
    # (Wave 89: native QUIC engine). `ring` may still appear via `songbird-cli` `ring-crypto` feature
    # gate (opt-in only). `wrappers` lists crates allowed to transitively pull ring in dev/feature builds.
    { name = "ring", version = "*", reason = "Violates ecoBin: C/ASM via `cc` (native crypto), not pure Rust.", wrappers = ["rcgen", "rustls"] },
]
skip = [
    # Transitive duplicates from upstream — tracked for elimination
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "bitflags" },
    { name = "hashbrown" },
    { name = "syn" },
    { name = "socket2" },
    { name = "parking_lot" },
    { name = "parking_lot_core" },
    { name = "getrandom" },
    { name = "indexmap" },
    { name = "generic-array" },
    { name = "tower" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "redox_syscall" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]

[advisories]
ignore = [
    # bytes: BytesMut::reserve integer overflow — awaiting upstream dep
    # updates to pull bytes >=1.10.1 transitively
    "RUSTSEC-2026-0007",
    # serde_json: stack exhaustion on deeply nested input — mitigated by
    # bounded input sizes in our JSON-RPC handlers
    "RUSTSEC-2026-0009",
    # bincode 1.x unmaintained (RUSTSEC-2025-0141) — transitive via tarpc /
    # tokio-serde. Migration: tarpc on bincode 2.x, or serde formats like postcard.
    "RUSTSEC-2025-0141",
    # fxhash: unmaintained — transitive dependency; no known vulnerabilities
    "RUSTSEC-2025-0057",
    # opentelemetry_api: merged into opentelemetry — transitive; awaiting
    # upstream migration in sysinfo/tracing ecosystem
    "RUSTSEC-2024-0387",
    # instant: unmaintained — transitive via parking_lot_core; no replacement
    # in stable ecosystem yet
    "RUSTSEC-2024-0384",
    # paste: unmaintained — transitive; no known vulnerabilities
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
