# Ultra-pedantic cargo-deny configuration for maximum security and hygiene
#
# Bluetooth `*-sys` / platform bindings: any such crates (e.g. from optional
# `legacy-bluetooth` / btleplug in songbird-genesis) are only pulled when those
# optional features are enabled — default builds use pure-Rust paths (e.g.
# `pure-bluetooth` / songbird-bluetooth).

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { name = "openssl", version = "*" },
    { name = "native-tls", version = "*" },
    { name = "reqwest", version = "<0.11" },
    { name = "hyper", version = "<0.14" },
    { name = "tokio", version = "<1.20" },
    { name = "serde_json", version = "<1.0.85" },
    # ecoBin: `ring` pulls C/ASM via `cc` — not pure Rust. Banned from all builds.
    #
    # LOCKFILE CHAIN (why ring appears in Cargo.lock):
    #   Chain A: songbird-cli → rustls-rustcrypto 0.0.2-alpha → rustls-webpki 0.102 → ring
    #   Chain B: songbird-universal[k8s] → kube 0.95 → kube-client → hyper-rustls[ring] → rustls[ring] → ring
    #
    # DEFAULT BUILD: ring is NOT compiled (`cargo tree -i ring` = no match).
    #   Chain A: rustls-webpki 0.102 is resolved but its ring dep is optional/unactivated.
    #   Chain B: kube is behind the `k8s` feature flag (not default, not enabled).
    #
    # --all-features BUILD: ring IS compiled (via Chain B — kube-client hardcodes
    #   hyper-rustls with the `ring` feature in kube 0.95).
    #
    # UPSTREAM FIXES NEEDED:
    #   - rustls-rustcrypto master has dropped webpki 0.102 → eliminates Chain A on release
    #   - kube-client needs hyper-rustls/aws-lc-rs option → eliminates Chain B
    #
    # This ban ensures ring can never be accidentally activated in default builds.
    { name = "ring", version = "*", reason = "Violates ecoBin: C/ASM via `cc` (native crypto), not pure Rust." },
]
skip = [
    # Transitive duplicates from upstream — tracked for elimination
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "bitflags" },
    { name = "hashbrown" },
    { name = "syn" },
    { name = "socket2" },
    { name = "getrandom" },
    { name = "indexmap" },
    { name = "generic-array" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "AGPL-3.0-or-later",
]

[advisories]
ignore = [
    # bincode 1.x unmaintained (RUSTSEC-2025-0141) — transitive via tarpc /
    # tokio-serde. Migration: tarpc on bincode 2.x, or serde formats like postcard.
    "RUSTSEC-2025-0141",
    # opentelemetry_api: merged into opentelemetry — transitive; awaiting
    # upstream migration in sysinfo/tracing ecosystem
    "RUSTSEC-2024-0387",
    # paste: unmaintained — transitive; no known vulnerabilities
    "RUSTSEC-2024-0436",
]

# EVOLUTION NOTE: serde_yaml 0.9 is archived by its maintainer (David Tolnay).
# Pure Rust via unsafe-libyaml — no C FFI, ecoBin compliant.
# Migration path: serde_yml (when it reaches 1.0) or consolidate all config to TOML.
# Used by: songbird-config, songbird-discovery (YAML config file parsing).

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
