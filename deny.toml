# Ultra-pedantic cargo-deny configuration for maximum security and hygiene
#
# Bluetooth `*-sys` / platform bindings: any such crates (e.g. from optional
# `legacy-bluetooth` / btleplug in songbird-genesis) are only pulled when those
# optional features are enabled — default builds use pure-Rust paths (e.g.
# `pure-bluetooth` / songbird-bluetooth).

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { name = "openssl", version = "*" },
    { name = "native-tls", version = "*" },
    { name = "reqwest", version = "<0.11" },
    { name = "hyper", version = "<0.14" },
    { name = "tokio", version = "<1.20" },
    { name = "serde_json", version = "<1.0.85" },
    # ecoBin: `ring` pulls C/ASM via `cc` — not pure Rust. Banned from all builds.
    #
    # STADIAL GATE ANALYSIS (April 16, 2026):
    #   `cargo tree -i ring --edges normal` = "did not match any packages"
    #   `cargo tree -i ring --all-features` = "did not match any packages"
    #   `cargo deny check bans` = passes (ring banned, not compiled)
    #   `ring` is NOT compiled in any build configuration.
    #
    # WHY ring REMAINS IN Cargo.lock:
    #   Cargo's resolver records versions for ALL optional dependencies in transitive
    #   crates, even when their feature flags are NOT activated. This is by-design for
    #   lockfile stability (so enabling a feature later uses the same version).
    #
    #   Packages declaring ring as optional (not activated):
    #     - rustls-webpki 0.102.8 (from rustls-rustcrypto) — ring optional, NOT in defaults
    #     - rustls-webpki 0.103.12 (from rustls) — ring optional, NOT in defaults
    #
    #   Investigated elimination paths (all infeasible):
    #     - rustls-rustcrypto git master: drops webpki 0.102, but uses pre-release
    #       RustCrypto crates (sha2 0.11, hmac 0.13, p256 0.14-rc) incompatible with
    #       workspace stable versions (sha2 0.10, hmac 0.12). No crates.io release.
    #     - Patching rustls-webpki to remove ring optional dep: fragile fork.
    #     - Alternative TLS stack: impractical (rustls is the pure-Rust standard).
    #
    # RESOLUTION: lockfile stanza is a Cargo metadata artifact with zero binary impact.
    # Stadial gate's own test (`cargo tree -i ring --edges normal`) passes.
    { name = "ring", version = "*", reason = "Violates ecoBin: C/ASM via `cc` (native crypto), not pure Rust." },
    { name = "aws-lc-sys", version = "*", reason = "Violates ecoBin: C/ASM via `cc` + cmake, not pure Rust." },
]
skip = [
    # Transitive duplicates from upstream — tracked for elimination
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "bitflags" },
    { name = "hashbrown" },
    { name = "syn" },
    { name = "socket2" },
    { name = "getrandom" },
    { name = "indexmap" },
    { name = "generic-array" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "AGPL-3.0-or-later",
]

[advisories]
ignore = [
    # bincode 1.x unmaintained (RUSTSEC-2025-0141) — transitive via tarpc /
    # tokio-serde. Migration: tarpc on bincode 2.x, or serde formats like postcard.
    "RUSTSEC-2025-0141",
    # opentelemetry_api: merged into opentelemetry — transitive; awaiting
    # upstream migration in sysinfo/tracing ecosystem
    "RUSTSEC-2024-0387",
    # paste: unmaintained — transitive; no known vulnerabilities
    "RUSTSEC-2024-0436",
    # hickory-proto O(n²) name compression (RUSTSEC-2026-0119) — Songbird is a
    # resolver client (not encoding DNS messages for others). Upgrade to 0.26
    # requires API migration (SRV field access changed). Stadial migration.
    "RUSTSEC-2026-0119",
    # hickory-proto NSEC3 infinite loop (RUSTSEC-2026-0118) — only affects
    # DnssecDnsHandle (DNSSEC validation). Songbird uses plain stub resolver
    # without DNSSEC features. Not reachable in our usage. Upgrade to 0.26
    # planned as stadial migration (major API breaking changes).
    "RUSTSEC-2026-0118",
]

# EVOLUTION NOTE: serde_yaml 0.9 is archived by its maintainer (David Tolnay).
# Pure Rust via unsafe-libyaml — no C FFI, ecoBin compliant.
# Migration path: serde_yml (when it reaches 1.0) or consolidate all config to TOML.
# Used by: songbird-config, songbird-discovery (YAML config file parsing).

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
