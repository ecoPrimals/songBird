[package]
name = "songbird-unwrap-migrator"
version = "0.1.0"
authors = ["Songbird Team"]
description = "Songbird-specific unwrap/expect migration tool for eliminating panic sources"
edition = "2021"

[workspace]
# Empty workspace table to make this a standalone tool

[[bin]]
name = "songbird-unwrap-migrator"
path = "src/main.rs"

[lib]
name = "songbird_unwrap_migrator"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.0"
songbird-types = { path = "../../crates/songbird-types" }

[dev-dependencies]
tempfile = "3.0"

# Standalone tool - adapted for Songbird from security_provider unwrap migrator 