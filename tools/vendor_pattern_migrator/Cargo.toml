[package]
name = "vendor-pattern-migrator"
version = "0.2.0"
edition = "2021"
authors = ["Songbird Team <team@songbird.eco>"]
description = "Detect and migrate hardcoded vendor patterns to capability-based alternatives"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ecoPrimals/songbird"
keywords = ["migration", "refactoring", "vendor", "agnostic", "capability"]
categories = ["development-tools", "command-line-utilities"]

# Standalone workspace to avoid conflicts
[workspace]

[[bin]]
name = "vendor-pattern-migrator"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive"] }

# Regex for pattern matching
regex = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[features]
default = []
# Enable additional debugging features
debug = [] 