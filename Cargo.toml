[workspace]
resolver = "2"
members = [
    "crates/songbird-core",
    "crates/songbird-network", 
    "crates/songbird-security",
    "crates/songbird-discovery",
    "crates/songbird-observability", 
    "crates/songbird-federation",
    "crates/songbird-registry",
    "crates/songbird-config",
    "crates/songbird-cli",
    "crates/songbird-errors",
    "crates/songbird-universal-primals",
    "apps/songbird-orchestrator"
]

[package]
name = "songbird-lib"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"
description = "Universal gaming bridge orchestrator and distributed networking platform"
readme = "README.md"
keywords = ["gaming", "orchestration", "networking", "distributed", "bridge"]
categories = ["game-engines", "network-programming", "web-programming"]

[[bin]]
name = "songbird"
path = "bin/songbird.rs"

[[bin]]
name = "gaming_demo"
path = "bin/gaming_demo.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"

[dependencies]
# Configuration
songbird-config = { path = "./crates/songbird-config" }

# Core functionality
songbird-core = { path = "./crates/songbird-core" }
songbird-errors = { path = "./crates/songbird-errors" }
songbird-network = { path = "./crates/songbird-network" }
songbird-security = { path = "./crates/songbird-security" }
songbird-observability = { path = "./crates/songbird-observability" }
songbird-discovery = { path = "./crates/songbird-discovery" }
songbird-federation = { path = "./crates/songbird-federation" }
songbird-registry = { path = "./crates/songbird-registry" }
songbird-cli = { path = "./crates/songbird-cli" }
songbird-universal-primals = { path = "./crates/songbird-universal-primals" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
bytes = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }

# Async traits
async-trait = "0.1"

# Configuration
config = "0.14"

# Base64 encoding/decoding
base64 = "0.22"

# Random number generation
rand = "0.8"
fastrand = "2.0"

# Additional dependencies for various features
once_cell = "1.19"
parking_lot = "0.12"
crossbeam-channel = "0.5"
dashmap = "5.0"
libc = "0.2"
ctrlc = "3.4"
yansi = "1.0"
sys-info = "0.9"
num_cpus = "1.0"
url = "2.5"
colored = "2.1"
lazy_static = "1.4"

# URL encoding
urlencoding = "2.1"

# System info
whoami = "1.6"
hostname = "0.3"

# File/Directory operations
dirs = "5.0"

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Gaming networking
pnet = "0.34"
boringtun = "0.6"
tun = "0.6"
byteorder = "1.5"

# Cryptography
ring = "0.17"
x25519-dalek = "=2.0.0-rc.3"

# Terminal
console = "0.15"
term_size = "0.3"

# Regular expressions
regex = "1.11"

# Additional crates
dialoguer = "0.11"
indicatif = "0.17"
tempfile = "3.0"
sysinfo = "0.30"
tarpc = { version = "0.36.0", features = ["full"] }
tokio-serde = { version = "0.9.0", features = ["json"] }

# Missing dependencies
local-ip-address = "0.5"
log = "0.4"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# Serialization 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
toml = "0.8"

# Concurrency
parking_lot = "0.12"

# CLI
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"

# Networking
trust-dns-resolver = "0.23"
socket2 = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
bincode = "1.3"

# URL encoding
urlencoding = "2.1"

# HTTP
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
bytes = "1.0"

# System info (needed by workspace members)
sys-info = "0.9"
num_cpus = "1.0"

# File/Directory operations
dirs = "5.0"

# === ANTI-MONOLITH WORKSPACE COMPLETE ===

[dev-dependencies]
axum-test = "15.0"

[[example]]
name = "demo_orchestration"
path = "examples/demo_orchestration.rs"
