[workspace]
resolver = "2"
members = [
    "crates/songbird-core",
    "crates/songbird-network", 
    "crates/songbird-security",
    "crates/songbird-discovery",
    "crates/songbird-observability", 
    "crates/songbird-federation",
    "crates/songbird-registry",
    "crates/songbird-config",
    "crates/songbird-cli",
    "crates/songbird-errors",
    "crates/songbird-universal-primals",
    "crates/songbird-universal",
    "crates/songbird-orchestrator",
    "crates/songbird-lib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# Serialization 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
toml = "0.8"

# Concurrency
parking_lot = "0.12"

# CLI
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"

# Networking
trust-dns-resolver = "0.23"
socket2 = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
bincode = "1.3"

# URL encoding
urlencoding = "2.1"

# HTTP
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
bytes = "1.0"

# System info (needed by workspace members)
sys-info = "0.9"
num_cpus = "1.0"

# File/Directory operations
dirs = "5.0"

# === ANTI-MONOLITH WORKSPACE COMPLETE ===

[profile.bench]
opt-level = 3
debug = false
lto = true
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true

