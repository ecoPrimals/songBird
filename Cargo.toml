[workspace]
resolver = "2"

# Exclude standalone example projects
exclude = [
    "examples/clients/rust",  # Standalone tarpc client example
]

members = [
    "crates/songbird-remote-deploy",
    "crates/songbird-compute-bridge",
    # 🏗️ FOUNDATION LAYER (4 crates)
    "crates/songbird-types",
    "crates/songbird-config",
    "crates/songbird-canonical",
    "crates/songbird-universal",
    
    # 🎯 CORE SERVICES (4 crates)
    "crates/songbird-discovery",
    "crates/songbird-registry",
    "crates/songbird-network-federation",  # CONSOLIDATED: network + federation
    # "crates/songbird-security-errors",     # REMOVED: Unified into songbird-types
    
    # 🚀 APPLICATIONS (2 crates)
    "crates/songbird-orchestrator",        # ENHANCED: includes core functionality
    "crates/songbird-cli",                 # ✅ COMPLETE: Fixed all syntax and type errors!
    
    # 🔧 DEVELOPMENT (2 crates)
    "crates/songbird-observability",
    "crates/songbird-test-utils",
    
    # 🌐 INTEGRATION (2 crates) - CONSOLIDATED
    # "crates/songbird-primal-sdk",        # ⚠️ DEFERRED: Cascading delimiter errors across multiple files (est. 2-4h systematic fix)
    "crates/songbird-squirrel-service", "crates/songbird-execution-agent",    # 🐿️ NEW: AI/MCP Service
    
    # 🔧 TOOLS
    # "tools/hardcoding-migrator",           # ⚠️ Missing directory
    
    # 🦅 ALBATROSS BENCHMARKS
    "showcase/05-albatross-multiplex/benchmark",
    "showcase/05-albatross-multiplex/tarpc-servers",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0"
authors = ["ecoPrimals <contact@ecoprimals.dev>"]
repository = "https://github.com/ecoPrimals/SongBird"
homepage = "https://songbird-gaming.ecoprimals.dev"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.46", features = ["full"] }  # Updated to fix slab vulnerability
async-trait = "0.1"
futures-util = "0.3.31"  # Force latest version
slab = "0.4.11"  # Force secure version to override vulnerable 0.4.10

# Serialization 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
toml = "0.8"

# Random number generation
fastrand = "2.0"
getrandom = "0.3"  # Force latest version to unify dependencies

# Concurrency
parking_lot = "0.12"
bitflags = "2.9"  # Force latest version to unify dependencies

# CLI
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"

# Networking
hickory-resolver = "0.24"  # Updated from trust-dns-resolver (unmaintained)
trust-dns-resolver = "0.23"  # Legacy support for migration
socket2 = "0.6"  # Updated to latest version to unify dependencies

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
bincode = "1.3"

# URL encoding
urlencoding = "2.1"

# HTTP
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
bytes = "1.0"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# System info (needed by workspace members)
sys-info = "0.9"
num_cpus = "1.0"
wasi = "0.14"  # Force latest version to unify dependencies

# File/Directory operations
dirs = "5.0"

# Performance testing
criterion = { version = "0.5", features = ["html_reports"] }

# tarpc for high-performance native RPC (Phase 3)
tarpc = { version = "0.34", features = ["full"] }

# === ANTI-MONOLITH WORKSPACE COMPLETE ===

[profile.bench]
opt-level = 3
debug = false
lto = true
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[workspace.lints.clippy]
# Lint groups must have lower priority than individual lints
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Individual pedantic lints we enforce
too_many_arguments = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"

# 🛡️ PRODUCTION CODE QUALITY ENFORCEMENT (Nov 2025)
# Prevent unwrap/expect in production code to maintain error handling quality
# Note: These are allowed in test code via #[cfg(test)] modules
unwrap_used = "warn"              # Warn on .unwrap() - prefer ? operator
expect_used = "warn"              # Warn on .expect() - prefer proper error handling
clone_on_ref_ptr = "warn"         # Catch unnecessary Arc/Rc clones
unnecessary_wraps = "warn"        # Catch Result<T, E> when E is never used

# Allow some clippy lints that are overly pedantic
# or don't apply well to our architecture  
module_name_repetitions = "allow"  # Acceptable for clarity
missing_const_for_fn = "allow"     # Not always beneficial
multiple_crate_versions = "allow"  # Dependencies may have version conflicts
uninlined_format_args = "allow"    # Test readability is more important
cognitive_complexity = "allow"     # Will refactor in Phase 2
significant_drop_tightening = "allow" # Will optimize in Phase 2
must_use_candidate = "allow"       # Will add in Phase 2
option_if_let_else = "allow"       # Will refactor in Phase 2
redundant_closure = "allow"        # Will optimize in Phase 2
missing_errors_doc = "allow"       # Will document in Phase 2
doc_markdown = "allow"             # Will fix in Phase 2
